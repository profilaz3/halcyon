name: CI

on:
  push:
    branches: [main]
  # Every pull request, including ones stacked on another branch.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    # A normal run takes about 15 minutes; stop a hung one well before
    # GitHub's 6-hour default.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Month for the apt cache key
        id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Restore apt packages
        id: apt-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/apt-cache
          key: apt-build-ubuntu-24.04-${{ steps.month.outputs.month }}-${{ hashFiles('.github/apt/build.txt', '.github/scripts/apt-install.sh') }}
          restore-keys: apt-build-ubuntu-24.04-${{ steps.month.outputs.month }}-
      - name: Install build and packaging dependencies
        timeout-minutes: 10
        run: .github/scripts/apt-install.sh .github/apt/build.txt ~/apt-cache
      - name: Save apt packages
        if: steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/apt-cache
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}
      - name: Install Rust 1.93
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.93.0'
      - uses: Swatinem/rust-cache@v2
      - name: Install the COSMIC icon theme for rendering tests
        # Activity island tests check rendered COSMIC symbolic icons. Ubuntu
        # does not package the theme, so install the reviewed upstream commit
        # that Pop!_OS 24.04 ships (cosmic-icons 0.1.0 f1a282a).
        run: |
          git init -q /tmp/cosmic-icons
          git -C /tmp/cosmic-icons fetch -q --depth 1 https://github.com/pop-os/cosmic-icons.git f1a282a0822aed1f0083dd2ab2e6c65bd5b401eb
          git -C /tmp/cosmic-icons checkout -q FETCH_HEAD
          test "$(git -C /tmp/cosmic-icons rev-parse HEAD)" = f1a282a0822aed1f0083dd2ab2e6c65bd5b401eb
          (cd /tmp/cosmic-icons && sudo just install)
          test -f /usr/share/icons/Cosmic/index.theme
      - name: Validate desktop metadata
        run: |
          appstreamcli validate --no-net packaging/io.github.profilaz3.Halcyon.metainfo.xml
          desktop-file-validate packaging/io.github.profilaz3.Halcyon.desktop
      - name: Build release binary
        run: cargo build --release --locked
      - name: Install Node.js for collector tests
        # The Worker tests use the built-in node:sqlite module (Node 22.13+).
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test activity collector
        run: |
          node --test scripts/usage/collector*.test.cjs
          node --test scripts/usage/worker/test/*.test.js
          python3 -m unittest discover -s scripts/usage -p 'test_*.py'
      - name: Test Python helpers and packaging
        run: |
          HALCYON_TEST_BINARY="$GITHUB_WORKSPACE/target/release/halcyon" \
            python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 -m unittest discover -s packaging -p 'test_*.py'
          python3 -m unittest discover -s packaging/updates -p 'test_*.py'
          python3 -m unittest discover -s packaging/islands -p 'test_*.py'
          python3 -m unittest discover -s scripts/rpm -p 'test_*.py'
          PYTHONPATH=companion python3 -m unittest discover -s companion -p 'test_*.py'
          PYTHONPATH=companion:scripts/compatibility python3 -m unittest discover -s scripts/compatibility -p 'test_*.py'
          # Ubuntu 24.04 restricts unprivileged user namespaces. Grant only
          # unshare permission to create one; keep the host-wide policy intact.
          # https://documentation.ubuntu.com/release-notes/24.04/
          if [ -r /proc/sys/kernel/apparmor_restrict_unprivileged_userns ] && \
             [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1 ]; then
            namespace_profile="$RUNNER_TEMP/halcyon-ci-unshare"
            cat > "$namespace_profile" <<'PROFILE'
          abi <abi/4.0>,
          profile halcyon-ci-unshare /usr/bin/unshare flags=(unconfined) {
            userns,
          }
          PROFILE
            sudo apparmor_parser -r "$namespace_profile"
            trap 'sudo apparmor_parser -R "$namespace_profile"' EXIT
          fi
          # The fixture refuses host root: uid 0 must map only to the runner uid.
          PYTHONPATH=companion:scripts/compatibility:scripts/apt \
            unshare --user --map-root-user python3 -m unittest discover -s scripts/apt -p 'test_*.py'
      - name: Test Rust
        # Bounded rendering workers must run with the shipped optimization profile.
        run: cargo test --release --locked -- --test-threads=1
      - name: Upload failed layout evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: layout-failure-${{ github.run_number }}
          path: target/test-failures/
          if-no-files-found: ignore
          retention-days: 3
      - name: Test Islands core
        run: cargo test --locked --manifest-path companion/dock-islands-core/Cargo.toml
      - name: Install license report generator
        run: cargo install cargo-about --locked --version 0.9.2 --features cli
      - name: Collect dependency licenses
        run: |
          cargo metadata --locked --format-version 1 \
            --filter-platform x86_64-unknown-linux-gnu > "$RUNNER_TEMP/cargo-metadata.json"
          python3 packaging/collect-licenses.py \
            --metadata "$RUNNER_TEMP/cargo-metadata.json" \
            --cargo-home "${CARGO_HOME:-$HOME/.cargo}" --allow-missing \
            --out "$RUNNER_TEMP/source-license-notices.txt"
          mkdir -p packaging/licenses
          cargo about generate --locked --fail \
            --config packaging/licenses/about.toml packaging/licenses/about.hbs \
            --output-file packaging/licenses/THIRD_PARTY_LICENSES.txt
          cat "$RUNNER_TEMP/source-license-notices.txt" >> packaging/licenses/THIRD_PARTY_LICENSES.txt
      - name: Build Debian package
        run: |
          python3 packaging/build-deb.py --development --binary target/release/halcyon \
            --version "$(dpkg-parsechangelog --file packaging/debian/changelog --show-field Version)~ci${GITHUB_RUN_NUMBER}" --out dist
      - name: Inspect Debian package
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: halcyon-deb-${{ github.run_number }}
          path: |
            dist/*.deb
            dist/*.sha256
          if-no-files-found: error
          retention-days: 3

  penumbra:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Month for the apt cache key
        id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Restore apt packages
        id: apt-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/apt-cache
          key: apt-penumbra-ubuntu-24.04-${{ steps.month.outputs.month }}-${{ hashFiles('.github/apt/penumbra.txt', '.github/scripts/apt-install.sh') }}
          restore-keys: apt-penumbra-ubuntu-24.04-${{ steps.month.outputs.month }}-
      - name: Install panel build dependencies
        timeout-minutes: 10
        run: .github/scripts/apt-install.sh .github/apt/penumbra.txt ~/apt-cache
      - name: Save apt packages
        if: steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/apt-cache
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.93.0'
      - name: Prepare pinned panel with both independent mods
        run: |
          python3 companion/build.py --with-penumbra --prepare-only \
            --workdir "$GITHUB_WORKSPACE/penumbra-panel" \
            --target-dir "$GITHUB_WORKSPACE/panel-target"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: penumbra-panel -> ../panel-target
      - name: Test native panel including Penumbra
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/panel-target
        working-directory: penumbra-panel
        run: cargo test --locked -p cosmic-panel-bin -- --test-threads=1
