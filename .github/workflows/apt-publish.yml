name: Publish and renew signed Halcyon APT
on:
  workflow_dispatch:
    inputs:
      bootstrap:
        description: First deployment only (must have no existing archive)
        type: boolean
        default: false
  schedule:
    - cron: '17 4 * * *'
permissions:
  contents: read
concurrency:
  group: halcyon-apt-pages
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'profilaz3/halcyon' && github.ref == 'refs/heads/main' && github.event.repository.default_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install archive verification tools on disposable runner
        run: sudo apt-get update && sudo apt-get install -y apt-utils gnupg appstream python3-apt
      - name: Download pinned releases, verify practical approval and retain previous archive
        env:
          FIRST_DEPLOYMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [ "$FIRST_DEPLOYMENT" = true ]; then args+=(--bootstrap); fi
          python3 -B scripts/apt/live.py prepare --work prepared "${args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apt-verified-${{ github.run_id }}
          path: |
            prepared/unsigned
            prepared/previous-proof
          if-no-files-found: error
          retention-days: 3
  sign:
    needs: prepare
    if: github.repository == 'profilaz3/halcyon' && github.ref == 'refs/heads/main' && github.event.repository.default_branch == 'main'
    environment: halcyon-apt
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: apt-verified-${{ github.run_id }}
          path: prepared
      - name: Install trusted index/signature verifier dependencies
        run: sudo apt-get update && sudo apt-get install -y apt-utils gnupg appstream rpm
      - name: Revalidate independent parent approval before secret use
        env:
          APPROVED_INPUTS: ${{ vars.HALCYON_APT_DISTRIBUTION_SHA256 }}
        run: python3 -B scripts/apt/live.py verify --work prepared --approved-inputs-sha256 "$APPROVED_INPUTS"
      - name: Sign immutable bytes with signing-only subkey
        env:
          HALCYON_APT_SIGNING_KEY: ${{ secrets.HALCYON_APT_SIGNING_KEY }}
          SIGNING_FINGERPRINT: ${{ vars.HALCYON_APT_SIGNING_FINGERPRINT }}
          APPROVED_INPUTS: ${{ vars.HALCYON_APT_DISTRIBUTION_SHA256 }}
        run: |
          python3 -B scripts/apt/live.py sign --work prepared --out signed \
            --approved-inputs-sha256 "$APPROVED_INPUTS" --signing-fingerprint "$SIGNING_FINGERPRINT"
      - name: Check expiry and Pages size before replacing site
        run: |
          python3 -B scripts/apt/check_expiry.py --archive signed \
            --archive-sha256 "$(sha256sum signed/archive.json | cut -d ' ' -f 1)" \
            --public-keyring packaging/updates/halcyon-archive-keyring.gpg
          python3 -B scripts/apt/live.py pages --work signed --out site
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site
  deploy:
    needs: sign
    if: github.repository == 'profilaz3/halcyon' && github.ref == 'refs/heads/main' && github.event.repository.default_branch == 'main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Atomically deploy the complete signed generation
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
# No pull_request, workflow_run or tag trigger. No candidate executables are run
# with the key. Failed preparation, signature, expiry or size checks never deploy.
# Durable inputs are pinned GitHub release assets; CI artifacts are transport only.
