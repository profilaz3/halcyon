[package]
name = "cosmic-ext-halcyon"
version = "0.6.1"
description = "Desktop widgets and themes for COSMIC"
homepage = "https://github.com/profilaz3/halcyon"
repository = "https://github.com/profilaz3/halcyon"
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0-or-later"

[package.metadata.halcyon]
bundled-islands = true

[[bin]]
name = "halcyon"
path = "src/main.rs"

[dependencies]
dock-islands-core = { path = "companion/dock-islands-core" }
# Reuse libcosmic's already locked icon resolver for selected-theme specimens.
freedesktop-icons = { package = "cosmic-freedesktop-icons", git = "https://github.com/pop-os/freedesktop-icons" }
cosmic = { package = "libcosmic", git = "https://github.com/pop-os/libcosmic", default-features = false, features = [
    "applet",
    "autosize",
    "multi-window",
    "tokio",
    "wayland",
    "wgpu",
    "winit",
    "xdg-portal",
] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["time", "macros", "sync", "net", "process", "io-util"] }
dirs = "5"
chrono = { version = "0.4", features = ["clock"] }
chrono-tz = "=0.10.4"
libc = "0.2"
notify = "8.2"
ron = "0.12"
# Floating-app rules are Rust regexes in the compositor; same version as
# cosmic-comp 4d14528. Shortcut keys use xkbcommon's keysym names.
regex = "=1.12.3"
xkbcommon = "=0.8.0"
# Wallpaper thumbnails and colour suggestions: PNG and JPEG only, the
# version libcosmic already locks.
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
# Music controls talk MPRIS on the session bus; the same zbus libcosmic
# already builds (with its tokio support), so no new crates are compiled.
# `p2p` speaks to the notification daemon over the panel's applet socket; it
# only enables uuid's v4 generator, already locked.
zbus = { version = "=5.17.0", default-features = false, features = ["tokio", "p2p"] }
# Calendar authorization uses the system keyring and Google's native-app PKCE flow.
secret-service = { version = "=5.2.0", features = ["rt-tokio-crypto-rust"] }
base64 = "=0.22.1"
sha2 = "=0.11.0"
getrandom = "=0.4.3"
ical = "=0.11.0"
rrule = "=0.14.0"

[patch.crates-io]
# Generated DST gaps must be skipped before COUNT is consumed. See the patch
# provenance and scope in vendor/rrule/HALCYON-PATCH.md.
rrule = { path = "vendor/rrule" }

[patch."https://github.com/pop-os/libcosmic"]
# libcosmic builds iced from its own submodule. This swaps in the same iced
# commit plus one fix: the wgpu image atlas no longer reserves a 16 MiB
# texture for every window up front, only once a window draws an image.
# Every iced crate must come from the same source, or Cargo builds two
# copies with mismatched types. Remove this once libcosmic picks up the fix
# (pop-os/iced lazy-image-atlas).
iced = { git = "https://github.com/profilaz3/iced", rev = "22c073b9e305d1d4738fd21547763cfcdf852b74" }
iced_accessibility = { git = "https://github.com/profilaz3/iced", rev = "22c073b9e305d1d4738fd21547763cfcdf852b74" }
iced_core = { git = "https://github.com/profilaz3/iced", rev = "22c073b9e305d1d4738fd21547763cfcdf852b74" }
iced_debug = { git = "https://github.com/profilaz3/iced", rev = "22c073b9e305d1d4738fd21547763cfcdf852b74" }
iced_futures = { git = "https://github.com/profilaz3/iced", rev = "22c073b9e305d1d4738fd21547763cfcdf852b74" }
iced_graphics = { git = "https://github.com/profilaz3/iced", rev = "22c073b9e305d1d4738fd21547763cfcdf852b74" }
iced_program = { git = "https://github.com/profilaz3/iced", rev = "22c073b9e305d1d4738fd21547763cfcdf852b74" }
iced_renderer = { git = "https://github.com/profilaz3/iced", rev = "22c073b9e305d1d4738fd21547763cfcdf852b74" }
iced_runtime = { git = "https://github.com/profilaz3/iced", rev = "22c073b9e305d1d4738fd21547763cfcdf852b74" }
iced_tiny_skia = { git = "https://github.com/profilaz3/iced", rev = "22c073b9e305d1d4738fd21547763cfcdf852b74" }
iced_wgpu = { git = "https://github.com/profilaz3/iced", rev = "22c073b9e305d1d4738fd21547763cfcdf852b74" }
iced_widget = { git = "https://github.com/profilaz3/iced", rev = "22c073b9e305d1d4738fd21547763cfcdf852b74" }
iced_winit = { git = "https://github.com/profilaz3/iced", rev = "22c073b9e305d1d4738fd21547763cfcdf852b74" }

[profile.release]
# Release packages ship without symbols.
strip = true

# Picture decoding, PNG encoding and software rasterizing touch every pixel
# and are about ten times slower unoptimized. The sandboxed preview workers
# have a 2 s CPU limit, and in a debug build a 4K bundled wallpaper alone
# used it up, so `cargo test` failed where `cargo test --release` passed.
# Optimize just these crates; Halcyon's own code stays debuggable.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.zune-core]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.simd-adler32]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.tiny-skia]
opt-level = 3
[profile.dev.package.tiny-skia-path]
opt-level = 3
