<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Halcyon: proposed app UX (interactive sample)</title><style>
*{box-sizing:border-box}
html.standalone{background:#0e1012}
body{margin:0;font-family:"Open Sans","Noto Sans",Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.4;color:var(--foreground,#e8e8e8)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}

/* ---------- review chrome (outside the app window) ---------- */
.review{display:flex;flex-direction:column;gap:10px;margin:0 auto 12px;max-width:1280px;padding:12px 2px 0}
.rv-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px}
.rv-top b{font-size:15px;letter-spacing:-.1px}
.rv-tag{font-size:12px;color:var(--muted-foreground,#a9b0b6)}
.rv-tools{display:flex;flex-wrap:wrap;gap:6px 14px;margin-left:auto;align-items:center;font-size:12px;color:var(--muted-foreground,#a9b0b6)}
.rv-tools label{display:inline-flex;align-items:center;gap:6px}
.rv-tools select,.rv-tools button{font-size:12px;padding:5px 8px;border-radius:8px;border:1px solid var(--border,#3a3f44);background:var(--secondary,#22262a);color:var(--foreground,#e8e8e8);min-height:30px}
.rv-tasks{display:flex;flex-wrap:wrap;gap:6px}
.rv-tasks button{font-size:12.5px;padding:7px 11px;border-radius:999px;border:1px solid var(--border,#3a3f44);background:var(--secondary,#22262a);color:var(--foreground,#e8e8e8);min-height:34px}
.rv-tasks button[aria-pressed=true]{background:#63d0df;border-color:#63d0df;color:#06262b;font-weight:600}
.coach{display:none;gap:10px 14px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-radius:12px;border:1px solid #63d0df66;background:color-mix(in srgb,#63d0df 10%,var(--card,#16191c))}
.coach.on{display:flex}
.coach .ct{flex:1 1 320px;min-width:0}
.coach .cs{font-size:12px;color:var(--muted-foreground,#a9b0b6)}
.coach .ci{font-size:14.5px;font-weight:600;margin:1px 0}
.coach .cn{font-size:12.5px;color:var(--muted-foreground,#b6bcc1)}
.coach .cb{display:flex;gap:6px;flex-wrap:wrap}
.coach button{font-size:12.5px;padding:7px 12px;border-radius:999px;border:1px solid var(--border,#3a3f44);background:var(--secondary,#22262a);color:var(--foreground,#e8e8e8);min-height:34px}
.coach button.go{background:#63d0df;border-color:#63d0df;color:#06262b;font-weight:600}
.coach.finished{border-color:#8fdcb0aa;background:color-mix(in srgb,#8fdcb0 10%,var(--card,#16191c))}
.frame-wrap{overflow:auto hidden;padding:2px}
.frame-wrap.center{display:flex;justify-content:center}

/* ---------- window + tokens ---------- */
.win{--bg:#1c1c1c;--nav:#262626;--card:#2c2c2c;--card2:#383838;--sunk:#222;--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.2);--ink:#ededed;--ink2:#bdbdbd;--ink3:#a0a0a0;--acc:#63d0df;--acc-ink:#06262b;--acc-text:var(--acc);--warn:#f2c76e;--warn-ink:#2c2006;--bad:#ff9c9c;--ok:#8fdcb0;--live:#ffae8a;--glow:#6a4fb0;
 position:relative;container:win/inline-size;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:var(--bg);color:var(--ink);border-radius:13px;overflow:hidden;box-shadow:0 0 0 1px var(--line2),0 24px 60px -24px rgba(0,0,0,.65);isolation:isolate;margin:0 auto}
.win[data-mode=Light]{--bg:#f3f3f3;--nav:#e8e8e8;--card:#fff;--card2:#e6e6e6;--sunk:#e4e4e4;--line:rgba(0,0,0,.1);--line2:rgba(0,0,0,.24);--ink:#1b1b1b;--ink2:#444;--ink3:#5c5c5c;--acc-text:color-mix(in srgb,var(--acc) 48%,#000);--warn:#8a5a00;--warn-ink:#fff;--bad:#b3261e;--ok:#17693f;--live:#a0431a}
.win[data-frame=fit]{width:100%;min-height:640px}
.win[data-frame=native]{width:820px;height:600px}
.win[data-frame=large]{width:1024px;height:720px}
.win[data-frame=wide]{width:1280px;height:800px}
.win button:focus-visible,.win input:focus-visible,.win select:focus-visible,.win textarea:focus-visible,.win summary:focus-visible,.win [tabindex]:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.win h1:focus,.win h1[tabindex]:focus-visible{outline:none}
.titlebar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;min-height:44px;padding:4px 10px;background:var(--bg);border-bottom:1px solid var(--line)}
.titlebar .tb-l{display:flex;align-items:center;min-width:0}
.titlebar .tb-t{font-size:13.5px;font-weight:600;white-space:nowrap}
.titlebar .tb-r{display:flex;justify-content:flex-end;gap:12px;color:var(--ink3);padding-right:6px}
.titlebar .tb-r svg{width:14px;height:14px}
.btn-back{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--acc-text);padding:7px 10px 7px 5px;border-radius:8px;font-weight:600;font-size:13.5px;min-height:34px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn-back:hover{background:var(--card)}
.shell{display:grid;grid-template-columns:196px minmax(0,1fr);min-height:0}
.nav{background:var(--nav);display:flex;flex-direction:column;gap:3px;padding:14px 10px;min-height:0;overflow:auto}
.nav .brand{font-size:19px;font-weight:700;padding:2px 10px 10px;letter-spacing:-.2px}
.nav .srch{display:flex;align-items:center;gap:8px;width:100%;padding:7px 12px;min-height:36px;border-radius:999px;border:1px solid var(--line2);background:transparent;color:var(--ink2);margin-bottom:10px;text-align:left}
.nav .srch:hover{background:var(--card)}
.nav .ni{position:relative;display:flex;align-items:center;gap:11px;width:100%;padding:10px 11px;min-height:44px;border:0;border-radius:10px;background:none;color:var(--ink);text-align:left;font-size:14.5px}
.nav .ni:hover{background:var(--card)}
.nav .ni[aria-current=page]{background:color-mix(in srgb,var(--acc) 22%,transparent);color:var(--acc-text);font-weight:600}
.nav .ni .dot{margin-left:auto;width:8px;height:8px;border-radius:50%;background:var(--acc);flex:none}
.nav .ni .dot.warn{background:var(--warn)}
.nav .sp{flex:1;min-height:12px}
.kept{border-top:1px solid var(--line);padding:10px 2px 0;display:flex;flex-direction:column;gap:3px}
.kept .kh{font-size:12px;font-weight:600;color:var(--ink2);padding:0 8px 2px;display:flex;align-items:center;gap:5px}
.kept button.kr{display:flex;align-items:center;gap:8px;border:0;background:none;color:var(--ink);width:100%;text-align:left;padding:6px 8px;border-radius:8px;font-size:12.5px;min-height:32px}
.kept button.kr:hover{background:var(--card)}
.kept .kr .dot{width:7px;height:7px;border-radius:50%;background:var(--acc);flex:none}
.kept .kr .dot.warn{background:var(--warn)}
.kept .kc{display:none}
.main{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0}
.ambient{position:absolute;inset:0 0 auto 0;height:260px;pointer-events:none;background:radial-gradient(70% 100% at 30% 0,color-mix(in srgb,var(--glow) 26%,transparent),transparent 72%);transition:background .4s}
.win[data-mode=Light] .ambient{opacity:.55}
.page{position:relative;flex:1;min-height:0;overflow:auto;padding:16px 20px 20px;scrollbar-gutter:stable}
.win[data-frame=fit] .page{overflow:visible}
.win[data-frame=fit] .solo-in{overflow:visible}
.win[data-frame=fit]{overflow:clip}
.win[data-frame=fit] #bar{position:sticky;bottom:0;z-index:5}
.shell.solo{grid-template-columns:minmax(0,1fr)!important}
.solo-in{min-height:0;overflow:auto}
.win.large .page{zoom:1.12}
.coach-ring{outline:3px solid #ffd166!important;outline-offset:2px;box-shadow:0 0 0 6px #ffd16633!important}

/* ---------- typography + atoms ---------- */
.crumb{display:flex;flex-wrap:wrap;align-items:center;gap:3px;font-size:12px;color:var(--ink3);margin-bottom:1px;min-height:18px}
.crumb button{border:0;background:none;padding:0 3px;color:var(--ink2);font-size:12px;border-radius:4px;min-height:24px;min-width:24px}
.crumb button:hover{color:var(--acc-text);text-decoration:underline}
.ph{display:flex;align-items:center;flex-wrap:wrap;gap:6px 12px;margin-bottom:12px;min-height:34px}
.ph .pt{flex:1 1 200px;min-width:0}
.ph h1{font-size:23px;font-weight:700;letter-spacing:-.25px;display:flex;align-items:center;gap:8px;line-height:1.2}
.ph h1 svg{width:21px;height:21px;color:var(--acc-text)}
.ph .sub{color:var(--ink2);font-size:13px;margin-top:1px}
.h2{font-size:13.5px;font-weight:700;color:var(--ink);margin:16px 0 6px;display:flex;align-items:center;gap:6px;min-height:24px}
.h2:first-child{margin-top:0}
.h2 .end{margin-left:auto;display:flex;align-items:center;gap:8px;font-weight:400;font-size:12.5px;color:var(--ink2)}
.ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.small{font-size:12px;color:var(--ink2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:34px;padding:6px 14px;border-radius:999px;border:0;background:var(--card2);color:var(--ink);font-size:13px;font-weight:600;white-space:nowrap}
.btn:hover{filter:brightness(1.12)}
.win[data-mode=Light] .btn:hover{filter:brightness(.96)}
.btn.primary{background:var(--acc);color:var(--acc-ink)}
.btn.quiet{background:transparent;color:var(--acc-text);padding:6px 10px}
.btn.quiet:hover{background:color-mix(in srgb,var(--acc) 14%,transparent);filter:none}
.btn.small-btn{min-height:30px;padding:4px 11px;font-size:12.5px}
.btn[disabled],.sw[disabled],.seg button[disabled],.pic[disabled],.sw[aria-disabled=true],.seg button[aria-disabled=true],.pic[aria-disabled=true]{opacity:.5;cursor:default;filter:none}
.btn.danger{color:var(--bad)}
.q{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;flex:none;border-radius:50%;border:0;background:var(--card2);color:var(--ink2);font-size:12px;font-weight:700;padding:0;line-height:1}
.q:hover,.q[aria-expanded=true]{background:var(--acc);color:var(--acc-ink)}
.pop{position:absolute;z-index:40;max-width:280px;padding:10px 12px;border-radius:10px;background:var(--card2);color:var(--ink);font-size:13px;line-height:1.45;box-shadow:0 12px 34px -8px rgba(0,0,0,.6),0 0 0 1px var(--line2)}
.pop[hidden]{display:none}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;padding:3px;border-radius:10px;background:var(--sunk);max-width:100%}
.seg button{border:0;background:none;color:var(--ink);padding:5px 10px;min-height:30px;min-width:30px;border-radius:8px;font-size:13px}
.seg button:hover{background:var(--card)}
.seg button[aria-pressed=true]{background:color-mix(in srgb,var(--acc) 26%,transparent);color:var(--acc-text);font-weight:600}
.tabs{display:flex;flex-wrap:wrap;gap:3px;margin:0 0 12px;border-bottom:1px solid var(--line);padding-bottom:6px}
.tabs button{border:0;background:none;color:var(--ink);padding:6px 12px;min-height:34px;border-radius:9px;font-size:13.5px;display:inline-flex;align-items:center;gap:6px}
.tabs button:hover{background:var(--card)}
.tabs button[aria-selected=true]{background:color-mix(in srgb,var(--acc) 22%,transparent);color:var(--acc-text);font-weight:600}
.tabs .dot{width:7px;height:7px;border-radius:50%;background:var(--acc)}
.sw{position:relative;flex:none;width:42px;height:24px;border-radius:12px;border:0;background:var(--card2);padding:0;box-shadow:inset 0 0 0 1px var(--line2)}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:var(--ink);transition:left .12s}
.sw[aria-checked=true]{background:var(--acc);box-shadow:none}
.sw[aria-checked=true]::after{left:21px;background:var(--acc-ink)}
.rows{background:var(--card);border-radius:12px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.r{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 12px}
.r+.r,.r+.ri,.ri+.r,.ri+.ri{border-top:1px solid var(--line)}
.r .l{flex:1 1 auto;min-width:0}
.r .lt{display:flex;align-items:center;gap:6px;font-size:13.5px}
.r .ls{font-size:12px;color:var(--ink2);margin-top:1px}
.r .ctl{flex:none;display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.r.stack{flex-direction:column;align-items:stretch;gap:6px}
.r.stack .ctl{justify-content:flex-start}
.r select,.r input[type=text],.field{min-height:34px;background:var(--sunk);border:1px solid var(--line2);border-radius:9px;padding:5px 9px;font-size:13px;max-width:100%}
.r input[type=range]{accent-color:var(--acc);width:150px;max-width:100%}
.ri{display:flex;align-items:center;gap:0;min-height:46px}
.ri .open{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:7px 8px 7px 12px;border:0;background:none;color:var(--ink);text-align:left;min-height:46px}
.ri .open:hover{background:color-mix(in srgb,var(--acc) 9%,transparent)}
.ri .open>.ico{color:var(--ink2)}
.ri .open .tx{flex:1;min-width:0}
.ri .open .tx b{display:block;font-weight:500;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri .open .tx span{display:block;font-size:12px;color:var(--ink2)}
.ri .open .tx span.run{color:var(--live);font-weight:600}
.ri .open .tx span.warn{color:var(--warn)}
.ri .open .chev{color:var(--ink3);width:15px;height:15px}
.ri .sw{margin-right:12px}
.thumb-s{width:34px;height:22px;border-radius:5px;background:center/cover;flex:none;box-shadow:0 0 0 1px var(--line2)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--card2);color:var(--ink2);white-space:nowrap}
.tag.acc{background:var(--acc);color:var(--acc-ink);font-weight:700}
.tag.warn{background:var(--warn);color:var(--warn-ink);font-weight:700}
.tag.live{background:var(--live);color:#2a1006;font-weight:700}
.win[data-mode=Light] .tag.live{color:#fff}
.tag.live i{width:7px;height:7px;border-radius:50%;background:currentColor}
.saving{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink2)}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--acc);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.err{font-size:12px;color:var(--bad);padding:0 12px 8px;display:flex;align-items:center;gap:6px}
.scope{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink);margin:0 0 10px;padding:4px 10px;border-radius:8px;background:var(--sunk)}
.scope b{color:var(--acc-text);font-weight:700}
.note{font-size:12.5px;color:var(--ink2);margin:6px 0 0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.note.next{color:var(--warn);font-weight:600;flex-wrap:nowrap;align-items:flex-start}
.split{display:grid;grid-template-columns:minmax(0,1fr) 316px;gap:16px;align-items:start}
.split>.st{position:sticky;top:0;min-width:0}
.split>.side{min-width:0}
.win[data-frame=fit] .split>.st{top:8px}
.editor{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
.editor>.st{position:sticky;top:0;min-width:0}
.editor>.side{min-width:0}
.form{max-width:640px}
.cap{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--ink2);min-height:30px}
.cap .end{margin-left:auto;display:flex;align-items:center;gap:8px}
.reveal{animation:reveal 1.6s ease-out 1;border-radius:10px}
@keyframes reveal{0%,40%{box-shadow:0 0 0 2px var(--acc),0 0 0 7px color-mix(in srgb,var(--acc) 30%,transparent)}100%{box-shadow:0 0 0 0 transparent}}

/* ---------- action bar ---------- */
.bar{position:relative;z-index:3;display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;min-height:48px;padding:6px 16px;border-top:1px solid var(--line);background:var(--bg)}
.bar .msg{flex:1 1 180px;min-width:0;font-size:12.5px;color:var(--ink2);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bar .msg b{color:var(--ink);font-weight:600}
.bar .acts{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-left:auto}
.bar.preview{background:color-mix(in srgb,var(--acc) 15%,var(--bg));border-top-color:color-mix(in srgb,var(--acc) 55%,transparent)}
.bar.conflict{background:color-mix(in srgb,var(--warn) 14%,var(--bg));border-top-color:color-mix(in srgb,var(--warn) 55%,transparent)}
.bar.doc{background:color-mix(in srgb,var(--warn) 9%,var(--bg))}
.bar .ok{color:var(--ok);width:15px;height:15px}

/* ---------- stage: a miniature of the real desktop ---------- */
.stage{position:relative;aspect-ratio:16/10;border-radius:14px;overflow:hidden;container-type:inline-size;background:#222 center/cover no-repeat;box-shadow:0 0 0 1px var(--line2),0 18px 44px -22px var(--glow);isolation:isolate}
.stage.fit-Fit{background-size:contain;background-color:#111}
.stage.fit-Stretch{background-size:100% 100%}
.stage .in{position:absolute;inset:0;font-size:1.25cqw;color:#fff;font-family:inherit;line-height:1.25;text-align:left}
.stage .in.big{font-size:clamp(9px,2.3cqw,15px)}
.stage .wp-hit{position:absolute;inset:0;border:0;background:none;padding:0;width:100%;height:100%;z-index:0;border-radius:0}
.stage .wp-hit:hover,.stage .wp-hit:focus-visible{box-shadow:inset 0 0 0 2px var(--acc)}
.stage .wp-hit:focus-visible{outline:none}
.stage .stag{position:absolute;z-index:6;font-size:11px;line-height:1.3;padding:2px 8px;border-radius:999px;background:#0d1214d9;color:#f1f5f6;font-weight:600;pointer-events:none}
.stage .stag.tl{left:8px;top:8px}
.stage .stag.bl{left:8px;bottom:8px;font-weight:500;background:#0d1214b0}
.stage .stag.prev{background:var(--acc);color:var(--acc-ink)}
.stage .stag.warn{background:var(--warn);color:var(--warn-ink)}
.fx{position:absolute;inset:0;pointer-events:none;z-index:1}
.fx.Rain{background:repeating-linear-gradient(105deg,transparent 0 1.1cqw,#d9ecff55 1.14cqw 1.2cqw,transparent 1.24cqw 2.6cqw);animation:rain 1.1s linear infinite;background-size:200% 200%}
@keyframes rain{to{background-position:-12cqw 24cqw}}
.fx.Snow{background-image:radial-gradient(#fff 0 .12cqw,transparent .22cqw),radial-gradient(#ffffffb0 0 .1cqw,transparent .18cqw);background-size:3.4cqw 4.6cqw,5.2cqw 7cqw;animation:snow 9s linear infinite}
@keyframes snow{to{background-position:2cqw 46cqw,-3cqw 70cqw}}
.fx.Fog{background:radial-gradient(60% 34% at 28% 62%,#dbe5efa0,transparent 72%),radial-gradient(70% 32% at 72% 72%,#dbe5ef90,transparent 72%),linear-gradient(transparent 44%,#d4deea55);animation:fog 16s ease-in-out infinite alternate}
@keyframes fog{to{transform:translateX(4cqw) scale(1.08)}}
.fx.Clouds{background:radial-gradient(40% 24% at 22% 34%,#0b1220a0,transparent 72%),radial-gradient(46% 28% at 74% 58%,#0b1220a0,transparent 72%);animation:fog 22s ease-in-out infinite alternate}
.win.reduce .fx,.win.reduce .spin{animation:none}
@media (prefers-reduced-motion:reduce){.fx,.spin,.reveal{animation:none}}
.panel{position:absolute;left:0;right:0;top:0;z-index:3;display:flex;align-items:center;justify-content:space-between;color:#fff;font-size:.92em;height:2.5em;padding:0 .9em;background:var(--pbg,#14191ee0);border:0;width:100%;text-align:left}
.panel.islands{background:none;justify-content:center;gap:.6em;top:.45em;height:2.1em}
.panel .is{display:flex;align-items:center;gap:.8em;padding:.32em .9em;background:var(--pbg,#14191ee0);border-radius:var(--prad,999px);white-space:nowrap}
.panel.bar-s .is{background:none;padding:0;border-radius:0}
.panel i{display:inline-block;width:.8em;height:.8em;border-radius:50%;background:currentColor;opacity:.78}
.dock{position:absolute;left:50%;transform:translateX(-50%);bottom:.8em;z-index:3;display:flex;align-items:center;gap:.5em;padding:.45em .7em;background:var(--dbg,#14191ee0);border-radius:var(--drad,999px);border:0}
.dock.attached{bottom:0;left:0;right:0;transform:none;justify-content:center;border-radius:0;width:100%}
.dock.hide{opacity:.5;outline:1px dashed #fff8;outline-offset:1px}
.dock i{display:block;width:1.9em;height:1.9em;border-radius:.5em;background:var(--c,#7cc)}
.obj{position:absolute;z-index:4;padding:0;border:0;background:none;color:inherit;font:inherit;text-align:left;border-radius:.9em;touch-action:none}
button.hot{cursor:pointer}
button.hot:hover,button.hot:focus-visible,.scope-hl{outline:2px solid var(--acc)!important;outline-offset:1px}
button.obj{cursor:pointer}
.obj.w{cursor:grab}
.obj.dragging{cursor:grabbing;opacity:.9;z-index:7}
button.obj:hover,button.obj:focus-visible,.obj.hl{outline:2px solid var(--acc)!important;outline-offset:2px}
.obj.selected{outline:2px solid var(--acc);outline-offset:2px}
.hit-label{position:absolute;z-index:8;display:none;font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--acc);color:var(--acc-ink);white-space:nowrap;pointer-events:none}
.desk-icons{position:absolute;left:1.5em;bottom:6em;display:grid;gap:.9em;z-index:2}
.desk-icons i{display:block;width:2.4em;height:2.4em;border-radius:.5em;background:#ffffff40}
.empty-disp{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:2;pointer-events:none;font-size:13px;color:#fff;text-shadow:0 1px 4px #000a}
.empty-disp span{padding:6px 12px;border-radius:999px;background:#0b1014b5}

/* widgets inside the stage (em-based, so the same art works at any size) */
.wc{min-width:13em;padding:.95em 1.1em;border-radius:.95em;background:var(--wbg,#17202ad6);color:var(--wfg,#f4f7f8);box-shadow:0 0 0 1px var(--wline,#ffffff1f)}
.wc small{display:block;font-size:.76em;opacity:.8}
.wc .row2{display:flex;align-items:center;gap:.7em}
.wc .bigt{font-size:2.4em;font-weight:300;line-height:1.05}
.fin-Clear{--wbg:#ffffff14;--wline:#ffffff30}
.fin-Frosted{--wbg:#1b2732c9;--wline:#ffffff24;backdrop-filter:blur(7px)}
.fin-Liquid{--wbg:linear-gradient(145deg,#ffffff2e,#ffffff0d);--wline:#ffffff47;border-radius:1.5em;backdrop-filter:blur(4px)}
.fin-Smoked{--wbg:#0c0f13eb;--wline:#ffffff17}
.m-Light .fin-Frosted{--wbg:#fff8efd9;--wfg:#2c2118;--wline:#00000017}
.m-Light .fin-Clear{--wbg:#ffffff55;--wfg:#2c2118;--wline:#0000001f}
.m-Light .fin-Liquid{--wbg:linear-gradient(145deg,#ffffffa8,#ffffff57);--wfg:#2c2118;--wline:#0000001f}
.wc-clock{min-width:0;background:none;box-shadow:none;padding:.2em .4em;backdrop-filter:none;text-shadow:0 .08em .5em #0007}
.wc-clock.card{background:var(--wbg);box-shadow:0 0 0 1px var(--wline);padding:.8em 1.2em;text-shadow:none}
.wc-clock .t{font-size:5.2em;font-weight:300;line-height:1;letter-spacing:-.02em}
.wc-clock .dt{font-size:1.05em;margin-top:.25em;opacity:.95}
.wc-clock[data-align=Center]{text-align:center}
.wc-clock[data-align=Right]{text-align:right}
.w-Light .wc-clock{color:#2c2118;text-shadow:none}
.wc-clock.card{color:var(--wfg,#f4f7f8)}
.analog{display:block;width:6.8em;height:6.8em}
.ev{display:flex;gap:.6em;font-size:.86em;padding:.22em 0;border-left:.14em solid var(--wacc,#6cd);padding-left:.5em;margin-top:.34em}
.ev span:first-child{opacity:.75;min-width:3em}
.meter{height:.42em;border-radius:.3em;background:#ffffff26;margin-top:.2em;overflow:hidden}
.meter i{display:block;height:100%;background:var(--wacc,#6cd);border-radius:.3em}
.mlabel{display:flex;justify-content:space-between;font-size:.82em;margin-top:.55em}
.cover{width:3.6em;height:3.6em;border-radius:.5em;background:linear-gradient(135deg,var(--wacc,#6cd),#7a5bc4);flex:none}
.mctl{display:flex;align-items:center;gap:.9em;margin-top:.7em;font-size:.95em}
.mctl span{opacity:.85}
.prog{height:.26em;border-radius:.2em;background:#ffffff33;margin-top:.7em}
.prog i{display:block;height:100%;width:38%;background:var(--wacc,#6cd);border-radius:.2em}
.viz{display:flex;align-items:flex-end;gap:.16em;height:1.9em;margin-top:.5em}
.viz i{flex:1;background:var(--wacc,#6cd);border-radius:.1em;opacity:.85}
.ring-viz{position:relative;width:4.4em;height:4.4em;flex:none;border-radius:50%;display:grid;place-items:center}
.ring-viz.bars{background:repeating-conic-gradient(var(--wacc,#6cd) 0 6deg,transparent 6deg 18deg);-webkit-mask:radial-gradient(circle,transparent 58%,#000 60%);mask:radial-gradient(circle,transparent 58%,#000 60%)}
.ring-viz.dots{background:radial-gradient(circle,var(--wacc,#6cd) 12%,transparent 14%) 0 0/1em 1em}
.ring-viz.rings{box-shadow:0 0 0 .22em var(--wacc,#6cd),0 0 0 .6em color-mix(in srgb,var(--wacc,#6cd) 40%,transparent),0 0 0 1em color-mix(in srgb,var(--wacc,#6cd) 16%,transparent)}
.timer-ring{width:6.2em;height:6.2em;border-radius:50%;display:grid;place-items:center;margin:.2em auto .4em;background:conic-gradient(var(--wacc,#6cd) 0 74%,#ffffff24 0);-webkit-mask:none}
.timer-ring b{display:grid;place-items:center;width:5.2em;height:5.2em;border-radius:50%;background:#10181fe0;font-weight:400;font-size:1em}
.sticky-w{max-width:17em;white-space:pre-wrap}
.m-Light .timer-ring b{background:#fff7ec;color:#2c2118}
.part-off{display:none!important}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.tile{display:block;width:100%;padding:0;border:0;border-radius:13px;background:var(--card);color:var(--ink);text-align:left;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.tile:hover{box-shadow:0 0 0 1.5px var(--acc)}
.tile[aria-pressed=true]{box-shadow:0 0 0 2px var(--acc)}
.tile .stage{border-radius:0;box-shadow:none;pointer-events:none}
.tile .tm{padding:8px 11px 10px}
.tile .tm b{display:block;font-size:14px}
.tile .tm span{font-size:12px;color:var(--ink2)}
.tile .sw-art{aspect-ratio:16/10;display:grid;grid-template-columns:repeat(4,1fr)}
.pics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pic{padding:0;border:0;border-radius:9px;overflow:hidden;background:var(--card);color:var(--ink);font-size:12px;text-align:left;box-shadow:0 0 0 1px var(--line)}
.pic:hover{box-shadow:0 0 0 1.5px var(--acc)}
.pic[aria-pressed=true]{box-shadow:0 0 0 2px var(--acc)}
.pic i{display:block;aspect-ratio:16/10;background:center/cover}
.pic span{display:block;padding:4px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.finishes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.finishes .pic i{display:grid;place-items:center;background-size:cover}
.finishes .pic i u{display:block;width:62%;height:56%;border-radius:8px;text-decoration:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:8px;padding:6px 11px 6px 7px;min-height:34px;border-radius:999px;border:0;background:var(--sunk);color:var(--ink);font-size:13px}
.chip:hover{background:var(--card2)}
.chip[aria-pressed=true]{background:color-mix(in srgb,var(--acc) 26%,transparent);color:var(--acc-text);font-weight:600}
.chip u{width:18px;height:18px;border-radius:50%;display:block;text-decoration:none;box-shadow:0 0 0 1px var(--line2)}

/* conflict */
.conflict{border-radius:12px;padding:12px;margin:0 0 12px;background:color-mix(in srgb,var(--warn) 11%,var(--card));box-shadow:0 0 0 1px color-mix(in srgb,var(--warn) 50%,transparent)}
.conflict h2{font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}
.cf{display:grid;grid-template-columns:minmax(90px,auto) 1fr 1fr;gap:8px;align-items:stretch;margin-top:10px}
.cf .n{font-size:13px;align-self:center}
.cf button{display:flex;align-items:center;gap:8px;text-align:left;padding:7px 10px;min-height:44px;border-radius:10px;border:0;background:var(--card2);color:var(--ink);font-size:12.5px;min-width:0}
.cf button:hover{box-shadow:0 0 0 1.5px var(--acc)}
.cf button small{display:block;color:var(--ink2);font-size:11.5px}

/* live control group */
.liveg{border-radius:12px;padding:12px;background:color-mix(in srgb,var(--live) 8%,var(--card));box-shadow:0 0 0 1px color-mix(in srgb,var(--live) 38%,transparent);margin-bottom:12px}
.liveg .lh{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13.5px;font-weight:700}
.liveg .big-time{font-size:34px;font-weight:300;font-variant-numeric:tabular-nums;line-height:1.1}
.liveg .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
textarea.notebox{display:block;width:100%;min-height:210px;resize:vertical;padding:12px;border-radius:12px;border:1px solid var(--line2);background:var(--card);line-height:1.5;font-size:14px}

/* wizard */
.wiz{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(330px,1fr);min-height:0;height:100%}
.wiz .wl{position:relative;min-height:0;padding:18px;display:flex;align-items:center;background:radial-gradient(90% 70% at 40% 30%,color-mix(in srgb,var(--glow) 32%,transparent),transparent 80%)}
.wiz .wl .stage{width:100%}
.wiz .wr{display:flex;flex-direction:column;min-height:0;padding:18px 20px 14px;border-left:1px solid var(--line);background:var(--bg)}
.wsteps{display:flex;gap:4px;margin-bottom:12px}
.wsteps span{flex:1;height:4px;border-radius:2px;background:var(--card2)}
.wsteps span.on{background:var(--acc)}
.wiz .ws{font-size:12px;color:var(--ink2)}
.wiz h1{font-size:24px;font-weight:700;letter-spacing:-.25px;line-height:1.2;margin:1px 0 3px}
.wiz .wb{flex:1;min-height:0;overflow:auto;margin:10px -6px 10px;padding:2px 6px}
.wiz .wf{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wiz .wf .end{margin-left:auto;display:flex;gap:6px}
.pick{display:flex;align-items:center;gap:11px;width:100%;padding:8px 10px;min-height:56px;border:0;border-radius:12px;background:var(--card);color:var(--ink);text-align:left;margin-bottom:7px;box-shadow:0 0 0 1px var(--line)}
.pick:hover{box-shadow:0 0 0 1.5px var(--acc)}
.pick[aria-pressed=true]{box-shadow:0 0 0 2px var(--acc)}
.pick i{display:block;width:56px;height:36px;flex:none;border-radius:7px;background:center/cover;box-shadow:0 0 0 1px var(--line2)}
.pick b{display:block;font-size:13.5px}
.pick span{display:block;font-size:12px;color:var(--ink2)}
.welcome{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(280px,1fr);gap:24px;align-items:center;padding:24px;height:100%}
.welcome img{display:block;width:100%;border-radius:14px;box-shadow:0 22px 50px -24px var(--glow)}
.welcome h1{font-size:32px;font-weight:700;letter-spacing:-.4px;line-height:1.15;margin-bottom:6px}
.welcome p{color:var(--ink2);margin-bottom:16px}

.leave .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.doneok{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:var(--acc);color:var(--acc-ink);margin-bottom:6px}

}
/* phone-width review only: the same screens as one ordered scroll */
@container win (max-width:620px){
 .shell{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
 .nav{flex-direction:row;flex-wrap:nowrap;overflow-x:auto;gap:2px;padding:6px;border-bottom:1px solid var(--line)}
 .nav .sp{display:none}
 .nav .srch,.nav .ni{flex:1 0 62px;min-width:62px}
 .kept{border:0;padding:0;flex:none}

 .split,.editor{grid-template-columns:minmax(0,1fr)}

 .bar{padding:6px 10px}

 .welcome{grid-template-columns:minmax(0,1fr);padding:14px}

}

function fresh(first=false){return{saved:clone(first?FIRST_RUN:FIXTURE),drafts:{},history:[],hid:1,route:{root:'Desktop',page:'home'},stack:[],viewDisplay:'Main display',note:{text:NOTE,saved:NOTE,undo:[],redo:[],state:'Saved',stamp:0,hint:''},focus:{running:true,left:1122,busy:false},music:{playing:true},pending:{},errors:{},msg:{text:'All changes saved',kind:'idle'},library:[],designs:{},schedules:[{id:1,on:true,when:'At sunset',what:['Wallpaper','Colors'],to:'Evening',display:'All displays'}],schedDraft:null,mix:null,sim:'ok',update:'current',checking:false,wizard:null,wizardKept:null,done:null,sessionPanel:(first?FIRST_RUN:FIXTURE).panelStyle,reviewMode:null,saveName:'My desktop',snap:true,sampleState:'Normal',setupFilter:'All',surfaceScope:'Everything',wallSource:'Halcyon',lastQuery:''}}
const val=k=>k in S.pending?S.pending[k].value:S.saved[k];
const busy=k=>k in S.pending;
const anyBusy=()=>Object.keys(S.pending).length>0;
function say(text,kind='ok',extra){S.msg={text,kind,...extra}}

/* ---------- desktop changes and scoped Undo ---------- */
function commit(label,fn){const before=clone(S.saved);fn(S.saved);const keys=Object.keys(S.saved).filter(k=>!same(before[k],S.saved[k]));if(!keys.length)return null;const e={id:S.hid++,label,keys,before:pick(before,keys),after:pick(S.saved,keys)};S.history.push(e);if(S.history.length>40)S.history.shift();say(label,'saved');return e}
const entryBlocked=e=>e.keys.some(k=>!same(S.saved[k],e.after[k]));
function undoEntry(e){if(!e)return false;if(entryBlocked(e)){say(`“${e.label}” changed again. Nothing was undone.`,'warn');return false}for(const k of e.keys)S.saved[k]=clone(e.before[k]);S.history=S.history.filter(x=>x!==e);say(`Undid ${e.label}`,'undo');return true}
function live(key,value,label){if(busy(key))return;delete S.errors[key];const mode=S.sim;const delay=mode==='slow'?1500:mode==='fail'?700:200;S.pending[key]={value,label};say(`Saving ${label}…`,'busy');render();setTimeout(()=>{delete S.pending[key];if(mode==='fail'){S.sim='ok';window.syncTools&&syncTools();S.errors[key]='Couldn’t save. Nothing changed.';say(`Couldn’t save ${label}`,'bad')}else commit(label,s=>{s[key]=value});render()},delay)}

/* ---------- retained previews: three-way, never a silent overwrite ---------- */
const DRAFT={wallpaper:{keys:()=>areaKeys('wallpaper'),title:()=>'Wallpaper',scope:()=>'wallpaper and effect',apply:'Apply wallpaper',route:()=>({root:'Desktop',page:'wallpaper'})},colors:{keys:()=>['theme','mode','accent'],title:()=>'Colors',scope:()=>'theme, mode and accent',apply:'Apply colors',route:()=>({root:'Appearance',page:'appearance',tab:'Colors'})},layout:{keys:()=>WKEYS.map(k=>'pos.'+k),title:()=>'Widget placement',scope:()=>'widget placement',apply:'Apply placement',route:()=>({root:'Desktop',page:'home'})},design:{keys:id=>[`d.${id.split(':')[1]}.design`],title:id=>WIDGETS[id.split(':')[1]].n+' design',scope:id=>WIDGETS[id.split(':')[1]].n+' only',apply:null,route:id=>({root:'Desktop',page:'design',obj:id.split(':')[1]})},setup:{keys:()=>DESKTOP_KEYS,title:id=>id.split(':')[1],scope:()=>'selected parts',apply:null,route:id=>({root:'Setups',page:'review',name:id.split(':')[1],tab:'Browse',cmp:'with'})}};
const kindOf=id=>id.split(':')[0];
function makeDraft(id,keys,values){const base=pick(S.saved,keys);const d={id,kind:kindOf(id),keys,base,values:values?clone(values):clone(base),steps:[],conflicts:[]};S.drafts[id]=d;return d}
const ensureDraft=id=>S.drafts[id]||makeDraft(id,DRAFT[kindOf(id)].keys(id));
const selectedKeys=d=>Object.entries(d.parts).filter(([,on])=>on).flatMap(([a])=>areaKeys(a));
const activeKeys=d=>d.kind==='setup'?selectedKeys(d):d.keys;
const dirtyKeys=d=>activeKeys(d).filter(k=>!same(d.values[k],d.base[k]));
const draftConflicts=d=>activeKeys(d).filter(k=>!same(S.saved[k],d.base[k])&&!same(d.values[k],d.base[k])&&!same(d.values[k],S.saved[k]));
function refreshDraft(d){for(const k of activeKeys(d)){if(same(S.saved[k],d.base[k]))continue;if(same(d.values[k],d.base[k])){d.values[k]=clone(S.saved[k]);d.base[k]=clone(S.saved[k])}else if(same(d.values[k],S.saved[k]))d.base[k]=clone(S.saved[k])}d.conflicts=draftConflicts(d);return d.conflicts}
function pruneDraft(id){const d=S.drafts[id];if(d&&d.kind!=='setup'&&!d.keys.some(k=>!same(d.values[k],d.base[k])))delete S.drafts[id]}
function draftSet(id,key,value,label){const d=ensureDraft(id);if(same(d.values[key],value)){pruneDraft(id);return}d.steps.push({key,prev:clone(d.values[key]),label:label||keyLabel(key)});d.values[key]=clone(value);pruneDraft(id)}
function undoDraftStep(d){const s=d.steps.pop();if(!s){say('Nothing to undo in this preview','idle');return false}if(s.part)d.parts[s.part]=s.prev;else d.values[s.key]=s.prev;say(`Undid ${s.label} in this preview`,'undo');pruneDraft(d.id);return true}
function applyDraft(id){const d=S.drafts[id];if(!d)return;refreshDraft(d);if(d.conflicts.length){say('Choose which values to keep','warn');render();return}const keys=dirtyKeys(d);const label=d.kind==='setup'?`Setup ${id.split(':')[1]}`:DRAFT[d.kind].title(id);commit(label,s=>{for(const k of keys)s[k]=clone(d.values[k])});delete S.drafts[id];if(d.kind==='setup'){S.route={root:'Setups',page:'setups',tab:S.route.tab==='Saved'?'Saved':'Browse'}}if(!keys.length)say('Nothing to apply','idle');render();landFocus()}
function discardDraft(id){const d=S.drafts[id];if(!d)return;delete S.drafts[id];say(`${DRAFT[d.kind].title(id)} preview discarded`,'idle');if(S.route.page==='review'&&d.kind==='setup'&&S.route.name===id.split(':')[1])S.route={root:'Setups',page:'setups',tab:S.route.tab==='Saved'?'Saved':'Browse'};render()}
function resolve(id,key,choice){const d=S.drafts[id];if(!d)return;if(choice==='current')d.values[key]=clone(S.saved[key]);d.base[key]=clone(S.saved[key]);d.conflicts=draftConflicts(d);if(d.kind!=='setup'&&!d.keys.some(k=>!same(d.values[k],d.base[k]))){delete S.drafts[id];say('Nothing left to apply. Preview closed.','idle')}else say(d.conflicts.length?'Choose the remaining values':'Ready to apply','idle');render()}
function keptItems(){const out=Object.values(S.drafts).filter(d=>d.kind!=='setup'||d.userTouched).map(d=>({id:d.id,title:DRAFT[d.kind].title(d.id),warn:draftConflicts(d).length>0,root:DRAFT[d.kind].route(d.id).root}));if(S.note.text!==S.note.saved)out.push({id:'note',title:'Unsaved note',warn:false,root:'Desktop'});return out}
function activeDraftId(){const r=S.route;if(S.wizard||S.done)return null;if(r.page==='wallpaper')return 'wallpaper';if(r.page==='home'||(r.page==='widget'&&r.tab==='Position'))return 'layout';if(r.page==='appearance'&&(r.tab||'Colors')==='Colors')return 'colors';if(r.page==='design')return 'design:'+r.obj;if(r.page==='review')return 'setup:'+r.name;return null}
const activeDraft=()=>{const id=activeDraftId();return id?S.drafts[id]:null};
const isNotesPage=()=>S.route.page==='widget'&&S.route.obj==='Notes'&&(S.route.tab||'Content')==='Content';

/* ---------- setups ---------- */
const captureDesktop=()=>pick(S.saved,DESKTOP_KEYS);
function openSetup(name){const id='setup:'+name;if(!S.drafts[id]){const entry=S.library.find(x=>x.name===name);const values=entry?clone(entry.values):{...captureDesktop(),...clone(LOOKS[name]?.v||{})};const d=makeDraft(id,DESKTOP_KEYS,values);d.parts=Object.fromEntries(AREAS.map(a=>[a.id,true]));d.userTouched=false}go({root:'Setups',page:'review',name,tab:S.route.page==='setups'?S.route.tab:'Browse',cmp:'with'})}
const candidate=d=>({...S.saved,...pick(d.values,selectedKeys(d))});
const partChanges=(d,a)=>areaKeys(a).filter(k=>!same(d.values[k],S.saved[k]));
function dropUntouched(except){for(const[id,d]of Object.entries(S.drafts))if(d.kind==='setup'&&!d.userTouched&&id!==except)delete S.drafts[id]}

/* ---------- navigation: Back is history, breadcrumb is parent, root is a stable landing ---------- */
const scroller=()=>$('.page');
function routeTitle(r){switch(r.page){case 'home':return'Desktop';case 'wallpaper':return'Wallpaper';case 'object':case 'form':case 'setting':return r.obj;case 'widget':return WIDGETS[r.obj].n;case 'design':return WIDGETS[r.obj].n+' design';case 'appearance':return'Appearance';case 'setups':return'Setups';case 'review':return r.name;case 'mix':return'Mix a setup';case 'schedule':return'New schedule';case 'settings':return'Settings';case 'search':return'Search results';default:return r.root}}
function parentOf(r){switch(r.page){case 'wallpaper':case 'object':case 'widget':case 'form':return{root:'Desktop',page:'home'};case 'design':return{root:'Desktop',page:'widget',obj:r.obj,tab:'Design'};case 'review':case 'mix':case 'schedule':return{root:'Setups',page:'setups',tab:r.tab||'Browse'};case 'setting':return{root:'Settings',page:'settings'};default:return null}}
function crumbs(r){const out=[];let p=parentOf(r);while(p){out.unshift(p);p=parentOf(p)}return out}
function draftIdFor(r){const keep=S.route;S.route=r;const id=activeDraftId();S.route=keep;return id}
function leaveNote(prev){const id=draftIdFor(prev);if(id&&id!==activeDraftId()&&S.drafts[id]&&(kindOf(id)!=='setup'||S.drafts[id].userTouched))say(`${DRAFT[kindOf(id)].title(id)} preview kept. Not applied.`,'kept',{resume:id})}
function go(r){const prev={...S.route,scroll:scroller()?.scrollTop||0};const rest={...prev};delete rest.scroll;delete rest.reveal;const next={...r};delete next.reveal;if(same(rest,next)&&!r.reveal){if(scroller())scroller().scrollTop=0;return}S.stack.push(prev);if(S.stack.length>40)S.stack.shift();S.route=r;dropUntouched(r.page==='review'?'setup:'+r.name:null);leaveNote(prev);render();if(scroller())scroller().scrollTop=0;landFocus()}
function back(){const r=S.stack.pop();if(!r)return;const prev=S.route;const top=r.scroll||0;const route={...r};delete route.scroll;S.route=route;dropUntouched(route.page==='review'?'setup:'+route.name:null);leaveNote(prev);render();if(scroller())scroller().scrollTop=top;landFocus()}
function landFocus(){const h=$('#win h1');if(h){h.setAttribute('tabindex','-1');h.focus({preventScroll:true})}const id=S.route.reveal;if(id){const el=$(`[data-r="${id}"]`);if(el){el.scrollIntoView({block:'center'});el.classList.add('reveal')}delete S.route.reveal}}

/* ---------- view helpers ---------- */
const help=(t,label='Help')=>`<button class="q" type="button" aria-label="${esc(label)}" aria-expanded="false" data-help="${esc(t)}">?</button>`;
function sw(key,name,opt={}){return `<button class="sw" role="switch" aria-checked="${!!val(key)}" aria-label="${esc(name)}" data-a="toggle:${key}:${esc(opt.label||name)}" ${busy(key)?'aria-disabled="true"':''}></button>`}
const plainSw=(on,name,action)=>`<button class="sw" role="switch" aria-checked="${!!on}" aria-label="${esc(name)}" data-a="${esc(action)}"></button>`;
function seg(items,cur,action,name,dis){return `<div class="seg" role="group" aria-label="${esc(name)}">${items.map(v=>`<button type="button" aria-pressed="${same(v,cur)}" data-a="${esc(action)}:${esc(v)}" ${dis?'aria-disabled="true"':''}>${esc(v)}</button>`).join('')}</div>`}

const liveSeg=(key,items,name,label)=>seg(items,val(key),`set:${key}:${label||name}`,name,busy(key))+savingMark(key);

function row(title,ctl,opt={}){return `<div class="r ${opt.stack?'stack':''}" ${opt.r?`data-r="${opt.r}"`:''}><div class="l"><div class="lt">${title}${opt.help?help(opt.help,'Help: '+String(title).replace(/<[^>]*>/g,'')):''}</div>${opt.sub?`<div class="ls">${opt.sub}</div>`:''}</div><div class="ctl">${ctl||''}</div></div>${opt.key?errRow(opt.key):''}`}
const swRow=(key,title,opt={})=>row(esc(title),savingMark(key)+sw(key,title,opt),{...opt,key});
const rows=(...x)=>`<div class="rows">${x.join('')}</div>`;
const selectCtl=(key,items,name,label)=>`<select aria-label="${esc(name)}" data-change="set:${key}:${esc(label||name)}">${items.map(v=>`<option ${same(v,val(key))?'selected':''}>${esc(v)}</option>`).join('')}</select>${savingMark(key)}`;
function openRow(icon,title,sub,action,opt={}){return `<div class="ri" ${opt.hl?`data-hl="${opt.hl}"`:''} ${opt.r?`data-r="${opt.r}"`:''}><button class="open" data-a="${esc(action)}">${opt.thumb?`<i class="thumb-s" style="background-image:${wallCss(opt.thumb)}"></i>`:ico(icon)}<span class="tx"><b>${esc(title)}</b>${sub?`<span class="${opt.subClass||''}" ${opt.timer?'data-timer-row':''}>${esc(sub)}</span>`:''}</span>${ico('chev','chev')}</button>${opt.ctl||''}</div>`}
function pageHead(title,opt={}){const c=crumbs(S.route);return `${c.length?`<nav class="crumb" aria-label="Location">${c.map(p=>`<button data-a="crumb:${esc(JSON.stringify(p))}">${esc(routeTitle(p))}</button><span aria-hidden="true">›</span>`).join('')}<span>${esc(title)}</span></nav>`:''}<div class="ph"><div class="pt"><h1>${opt.icon?ico(opt.icon):''}${esc(title)}</h1>${opt.sub?`<div class="sub">${esc(opt.sub)}</div>`:''}</div>${opt.end||''}</div>`}
const tabs=(items,cur,action,name,dots={})=>`<div class="tabs" role="tablist" aria-label="${esc(name)}">${items.map(t=>`<button role="tab" aria-selected="${t===cur}" data-a="${esc(action)}:${esc(t)}">${esc(t)}${dots[t]?'<i class="dot" title="Preview kept"></i>':''}</button>`).join('')}</div>`;
const fmtTime=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;

 switch(k){

 case 'Projects':return `<div class="${fin()}" style="min-width:15em"><small>PROJECTS · sample</small><div class="mlabel"><span>halcyon</span><span>main</span></div><div class="mlabel"><span>notes-site</span><span>2 changes</span></div></div>`;
 case 'Music':{const viz=c['d.Music.viz'];const bars=c['d.Music.spectrum']?`<div class="viz">${[34,60,82,48,70,92,54,30,62,76,44,28].map(h=>`<i style="height:${paused?10:h}%"></i>`).join('')}</div>`:'';const cover=viz==='Card'?`<div class="cover ${off('Artwork')}"></div>`:`<div class="ring-viz ${viz==='Radial bars'?'bars':viz==='Orbit dots'?'dots':'rings'} ${off('Artwork')}"></div>`;return `<div class="${fin()}" style="min-width:21em"><div class="row2">${cover}<div class="${off('Title')}" style="min-width:0"><div style="font-size:1.1em">Sample track</div><small>Sample artist · Sample album</small></div></div>${bars}<div class="mctl ${off('Controls')}"><span>⏮</span><span>${paused?'▶':'⏸'}</span><span>⏭</span></div><div class="prog ${off('Progress')}"><i></i></div></div>`}

/* The stage is a miniature of the real desktop. `interactive` makes its objects real controls. */
function stage(o={}){const c={...S.saved,...(o.cfg||{})};const display=o.display||'Main display';const interactive=o.interactive;const here=WKEYS.filter(k=>c.showWidgets!==false&&c['on.'+k]&&c['pos.'+k].d===display);const hl=o.hl||[];const objs=here.map(k=>{const p=c['pos.'+k];const on=hl.includes(k)||hl.includes('Widgets');const art=widgetArt(k,c,{state:o.state});return interactive?`<button class="obj w ${on?'hl':''} ${o.selected===k?'selected':''}" data-w="${k}" data-obj="${k}" style="left:${p.x}%;top:${p.y}%" aria-label="${esc(WIDGETS[k].n)}. Enter opens. Arrow keys move.">${art}</button>`:`<div class="obj ${on?'hl':''} ${o.selected===k?'selected':''}" data-obj="${k}" style="left:${p.x}%;top:${p.y}%">${art}</div>`}).join('');const accent=ACCENTS[c.accent]||ACCENTS.Cyan;const fxOp=Math.max(.2,(c.density||40)/100);const tags=`${o.badge?`<span class="stag tl ${o.badgeCls||''}">${esc(o.badge)}</span>`:''}${o.sample===false?'':`<span class="stag bl">Sample</span>`}`;return `<div class="stage fit-${esc(c.fit)} m-${c.mode==='Light'?'Light':'Dark'} ${c.wall==='Paper'?'w-Light':''}" style="background-image:${wallCss(c.wall)};--wacc:${accent}" ${interactive?'':`role="img" aria-label="${esc(o.label||'Desktop preview')}"`}><div class="in" ${interactive?'':'aria-hidden="true"'}>${interactive?`<button class="wp-hit" data-a="open:wallpaper" aria-label="Wallpaper ${esc(c.wall)}. Open editor."></button>`:''}${c.effect&&c.effect!=='None'?`<div class="fx ${esc(c.effect)}" style="opacity:${fxOp}"></div>`:''}${c.desktopIcons?'<div class="desk-icons"><i></i><i></i><i></i></div>':''}${panelArt(c,{btn:interactive,hl:hl.includes('Panel')})}${objs}${dockArt(c,{btn:interactive,hl:hl.includes('Dock')})}${o.extra||''}</div>${tags}</div>`}
/* A single object at useful size, on your wallpaper */
function objectStage(k,o={}){const c={...S.saved,...(o.cfg||{})};return `<div class="stage fit-${esc(c.fit)} m-${c.mode==='Light'?'Light':'Dark'} ${c.wall==='Paper'?'w-Light':''}" style="background-image:${wallCss(c.wall)};--wacc:${ACCENTS[c.accent]}" role="img" aria-label="${esc(WIDGETS[k].n)} preview with sample content"><div class="in big" style="display:grid;place-items:center" aria-hidden="true">${widgetArt(k,c,{parts:o.parts,state:o.state})}</div>${o.badge?`<span class="stag tl ${o.badgeCls||''}">${esc(o.badge)}</span>`:''}<span class="stag bl">Sample content · not clickable</span></div>`}
function conflictBox(d){const cf=d.conflicts.length?d.conflicts:draftConflicts(d);if(!cf.length)return'';const thumb=(k,v)=>k==='wall'?`<i class="thumb-s" style="background-image:${wallCss(v)}"></i>`:'';return `<section class="conflict" aria-label="Changed elsewhere"><h2>${ico('warn')}Changed while this was waiting</h2><div class="small" style="margin-top:2px">Your preview is safe. Pick one for each.</div>${cf.map(k=>`<div class="cf" data-cf="${k}"><div class="n">${esc(keyLabel(k))}</div><button data-a="resolve:${d.id}:${k}:current">${thumb(k,S.saved[k])}<span><small>Keep current</small>${esc(fmt(k,S.saved[k]))}</span></button><button data-a="resolve:${d.id}:${k}:mine">${thumb(k,d.values[k])}<span><small>Use my preview</small>${esc(fmt(k,d.values[k]))}</span></button></div>`).join('')}</section>`}

/* ---------- Desktop: everything you can point at ---------- */
function wStatus(k){const s=S.saved;if(k==='Focus'&&(S.focus.running||S.focus.left<1500))return{t:`${S.focus.running?'Running':'Paused'} ${fmtTime(S.focus.left)} · ${s['on.Focus']?'visible':'hidden'}`,c:S.focus.running?'run':'',timer:true};if(k==='Calendar'&&!s['on.Calendar'])return{t:'Not connected'};if(k==='Projects'&&!s['on.Projects'])return{t:'Choose folders'};if(k==='Weather'&&!s.city)return{t:'Needs a city',c:'warn'};if(k==='Notes'&&S.note.text!==S.note.saved)return{t:'Unsaved note',c:'warn'};if(k==='Overview'&&!s['on.Overview'])return{t:'Clock, weather, agenda'};if(!s['on.'+k])return{t:'Off'};return{t:s['pos.'+k].d}}

 const side=`<div class="h2">On your desktop</div>${rows(openRow('image','Wallpaper',`${S.saved.wall}${S.saved.effect!=='None'?' · '+S.saved.effect:''}`,'open:wallpaper',{thumb:S.saved.wall,hl:'wallpaper'}),openRow('panel','Panel',`${S.saved.panelStyle} · ${S.saved.panelShape.toLowerCase()}`,'object:Panel',{hl:'Panel'}),openRow('dock','Dock',`${S.saved.dockFloat?'Floating':'Attached'} · ${S.saved.dockShape.toLowerCase()}`,'object:Dock',{hl:'Dock'}),openRow('apps','Desktop icons',S.saved.desktopIcons?'On':'Off','form:Desktop icons'))}<div class="h2" data-r="widgets">Widgets <span class="end">${savingMark('showWidgets')}<span class="small">Show all</span>${sw('showWidgets','Show all widgets',{label:'Show widgets'})}</span></div>${errRow('showWidgets')}${rows(...WKEYS.map(k=>{const st=wStatus(k);return openRow(WIDGETS[k].i,WIDGETS[k].n,st.t,'w:'+k,{hl:k,subClass:st.c,timer:st.timer,r:'w-'+k,ctl:savingMark('on.'+k)+sw('on.'+k,'Show '+WIDGETS[k].n+' on desktop',{label:WIDGETS[k].n+' on desktop'})})+errRow('on.'+k)}))}<div class="h2">How it behaves</div>${rows(openRow('windows','Windows & workspaces','Tiling, gaps, focus','form:Windows & workspaces'),openRow('keys','Shortcuts','Keys and commands','form:Shortcuts'))}`;
 return `${pageHead('Your desktop',{end:`<button class="btn small-btn" data-a="overlay">Arrange on real desktop</button>`})}<div class="split"><div class="st">${d?conflictBox(d):''}${stage({interactive:true,cfg,display:S.viewDisplay,badge:d?'Preview · not applied':'',badgeCls:d?(d.conflicts.length?'warn':'prev'):'',extra})}<div class="cap"><span>Viewing</span>${seg(['Main display','Laptop'],S.viewDisplay,'view','Viewing display')}${help('This only changes the picture you see here. To move a widget to another display, open it and choose Position.','Help: viewing a display')}<span class="end small">${d?`<span style="display:inline-flex;gap:8px;align-items:center">Snap ${plainSw(S.snap,'Snap to grid','snap')}</span>`:'Click to edit · drag to move'}</span></div><div class="h2">Try a look <span class="end"><button class="btn quiet small-btn" data-a="root:Setups">All setups ${ico('chev')}</button></span></div><div class="pics try">${tiles}</div></div><div class="side">${side}</div></div>`}
function wallpaperView(){const d=S.drafts.wallpaper;if(d)refreshDraft(d);const v=d?d.values:S.saved;const pics=(list)=>`<div class="pics">${list.map(w=>`<button class="pic" aria-pressed="${v.wall===w}" data-a="setD:wallpaper:wall:${w}"><i style="background-image:${wallCss(w)}"></i><span>${w}</span></button>`).join('')}</div>`;const tiles=S.wallSource==='Halcyon'?pics(['Evening','Tidal','Paper']):S.wallSource==='Colors'?pics(['Solid','Gradient']):`<div class="small" style="padding:6px 2px">${S.wallSource==='Yours'?'Your pictures would appear here.':'COSMIC wallpapers would appear here.'}</div>`;
 return `${pageHead('Wallpaper',{icon:'image'})}${d?conflictBox(d):''}<div class="split"><div class="st">${stage({cfg:v,badge:d?'Preview · not applied':'Current',badgeCls:d?(d.conflicts.length?'warn':'prev'):''})}<div class="cap"><span class="scope" style="margin:0">Changes: <b>${esc(v.wallScope==='All displays'?'all displays':v.wallScope)}</b></span>${help('Picture, fit and effect are one preview. Apply them together or discard them together.','Help: what Apply changes')}</div></div><div class="side"><div class="h2">Picture</div>${seg(['Halcyon','COSMIC','Yours','Colors'],S.wallSource,'wallsrc','Wallpaper source')}<div style="margin-top:8px">${tiles}</div><div class="h2">Effect ${help('Effects run on the wallpaper, behind your windows. Reduce motion in Settings keeps them still.','Help: effects')}</div>${rows(`<div class="r stack" data-r="effects"><div class="ctl">${seg(['None','Rain','Snow','Fog','Clouds'],v.effect,'setD:wallpaper:effect','Effect')}</div>${v.effect!=='None'?`<label class="small" style="display:flex;align-items:center;gap:8px">Intensity <input type="range" min="10" max="100" value="${v.density}" aria-label="Effect intensity" data-range="wallpaper:density"></label>`:''}</div>`)}<div class="h2">Fit and display</div>${rows(`<div class="r stack"><div class="ctl">${seg(['Fill','Fit','Stretch'],v.fit,'setD:wallpaper:fit','Fit')}</div><div class="ctl">${seg(['All displays','Main display','Laptop'],v.wallScope,'setD:wallpaper:wallScope','Wallpaper display')}</div></div>`)}</div></div>`}
function objectView(){const o=S.route.obj;const c=S.saved;const sys=`<button class="btn quiet small-btn" data-a="sys">System settings ↗</button>`;if(o==='Panel')return `${pageHead('Panel',{icon:'panel',end:sys})}<div class="editor"><div class="st">${stage({hl:['Panel']})}<div class="cap"><span class="scope" style="margin:0">Changes: <b>panel only</b></span></div></div><div class="side">${rows(row('Style',liveSeg('panelStyle',['Bar','Islands'],'Panel style','Panel style'),{stack:1,key:'panelStyle',help:'Islands are separate groups on the panel. Halcyon includes them. A change starts at your next login, and the current panel keeps running.'}))}${val('panelStyle')!==S.sessionPanel?`<p class="note next">${ico('history')}Starts at next login. You don’t need to log out now.</p>`:''}<div class="h2">Look</div>${rows(row('Shape',liveSeg('panelShape',['Pill','Rounded','Square'],'Panel shape','Panel shape'),{stack:1,key:'panelShape'}),row('Size',liveSeg('panelSize',['S','M','L'],'Panel size','Panel size'),{key:'panelSize'}),row('Finish',`<button class="btn quiet small-btn" data-a="surfaces:Panel">${esc(finishOf(c,'Panel'))} ${ico('chev')}</button>`))}<div class="h2">Applets</div>${rows(openRow('grid','Applets and arrangement','Workspaces, launcher, status','applets'))}</div></div>`;
 return `${pageHead('Dock',{icon:'dock',end:sys})}<div class="editor"><div class="st">${stage({hl:['Dock']})}<div class="cap"><span class="scope" style="margin:0">Changes: <b>dock only</b></span></div></div><div class="side"><div class="h2">Position</div>${rows(row('Screen edge',liveSeg('dockEdge',['Top','Bottom','Left','Right'],'Screen edge','Dock edge'),{stack:1,key:'dockEdge'}),swRow('dockFloat','Floating',{label:'Dock floating'}),swRow('dockHide','Hide behind windows',{label:'Dock hide'}))}<div class="h2">Look</div>${rows(row('Shape',liveSeg('dockShape',['Pill','Rounded','Square'],'Dock shape','Dock shape'),{stack:1,key:'dockShape'}),row('Size',liveSeg('dockSize',['XS','S','M','L','XL'],'Dock size','Dock size'),{stack:1,key:'dockSize'}),row('Finish',`<button class="btn quiet small-btn" data-a="surfaces:Dock">${esc(finishOf(c,'Dock'))} ${ico('chev')}</button>`))}</div></div>`}

function contentView(k){const editor=(preview,side)=>`<div class="editor"><div class="st">${preview}</div><div class="side">${side}</div></div>`;const prev=()=>objectStage(k);switch(k){

 case 'System':return editor(prev(),rows(swRow('c.System.gpu','Graphics',{label:'GPU row'}),swRow('c.System.net','Network',{label:'Network row'}),openRow('pulse','Service status','Choose what to watch','sys')));

 }return ''}

 return `<div class="editor"><div class="st">${objectStage(k)}</div><div class="side"><div class="scope" data-scope>Changes: <b>${esc(w.n)} only</b> ${help('Settings here save right away and offer a named Undo. They never touch other widgets, the dock or the panel.','Help: what this changes')}</div>${own}<div class="h2">Surface</div>${rows(row('Surface',liveSeg(surfKey,['Follow desktop','None','Panel'],'Surface',w.n+' surface'),{stack:1,key:surfKey}),row('Desktop finish',`<button class="btn quiet small-btn" data-a="surfaces:Widgets">${esc(fin)} ${ico('chev')}</button>`,{sub:'Shared by all widgets',help:'Follow desktop uses this finish. Changing it changes all widgets, so it opens in Appearance.'}))}${w.parts?`<div class="h2">Your own design</div>${rows(openRow('sliders',kept?'Continue design':cur?cur.name||'Custom design':'Built-in design',kept?'Preview kept · not applied':'Parts, layouts, saved copies','design:'+k,{subClass:kept?'warn':''}))}`:''}</div></div>`}

function surfacesTab(){const scope=S.surfaceScope;const target=scope==='Everything'?null:scope;const key=target?'finish.'+target:'finish';const cur=val(key);const eff=cur||S.saved.finish;const label={Everything:'everything',Widgets:'all widgets',Panel:'panel only',Dock:'dock only'}[scope];const hl=target?[target]:['Widgets','Panel','Dock'];const fins={Clear:'#ffffff30',Frosted:'#1b2732c9',Liquid:'linear-gradient(145deg,#ffffff60,#ffffff14)',Smoked:'#0c0f13eb'};return `<div class="split"><div class="st">${stage({hl})}<div class="cap"><span class="scope" style="margin:0" data-scope>Changes: <b>${esc(label)}</b></span>${help('Outlined items are the ones this changes. It saves right away and offers a named Undo.','Help: surface scope')}</div></div><div class="side"><div class="h2">Applies to</div>${seg(['Everything','Widgets','Panel','Dock'],scope,'surface-scope','Surface scope')}<div class="h2">Finish ${savingMark(key)}</div><div class="finishes" data-r="finish">${Object.entries(fins).map(([n,bg])=>`<button class="pic" aria-pressed="${eff===n}" data-a="set:${key}:${esc((target?target+' ':'')+'finish')}:${n}" ${busy(key)?'aria-disabled="true"':''}><i style="background-image:${wallCss(S.saved.wall)}"><u style="background:${bg};box-shadow:0 0 0 1px #fff4"></u></i><span>${n}</span></button>`).join('')}</div>${errRow(key)}<p class="note">Opacity, corners, outline and readability stay here.</p>${target?`<p class="note">${cur?`${esc(target)} has its own finish. <button class="btn quiet small-btn" data-a="set:${key}:${esc(target+' finish')}:null">Use Everything</button>`:`${esc(target)} follows Everything.`}</p>`:''}</div></div>`}

function savedTab(){return `<div class="h2">Save your desktop ${help('Saves wallpaper, colors, widget style and placement, dock, panel, windows, workspaces and desktop icons. Notes, calendars and accounts are not included.','Help: what is saved')}</div>${rows(`<div class="r"><label class="small" for="savename" style="flex:none">Name</label><input id="savename" type="text" class="field" style="flex:1;min-width:80px" data-k="savename" value="${esc(S.saveName)}"><button class="btn primary small-btn" data-a="save-current">Save</button></div>`)}<p class="note">Saving doesn’t change your desktop.</p><div class="h2">Your setups <span class="end"><button class="btn quiet small-btn" data-a="cmd:Import a setup package">Import…</button></span></div>${S.library.length?`<div class="rows">${S.library.map(e=>`<div class="ri" data-lib="${esc(e.name)}"><button class="open" data-a="setup:${esc(e.name)}"><i class="thumb-s" style="background-image:${wallCss(e.values.wall)}"></i><span class="tx"><b>${esc(e.name)}</b><span>${esc(e.values.wall)} · ${esc(e.values.theme)}</span></span>${ico('chev','chev')}</button><button class="btn quiet small-btn" style="margin-right:4px" data-a="cmd:Export ${esc(e.name)}">Export</button><button class="btn quiet small-btn danger" style="margin-right:8px" data-a="lib-del:${esc(e.name)}">Delete</button></div>`).join('')}</div>`:`<div class="rows"><div class="r"><span class="small">Nothing saved yet.</span></div></div>`}`}

function scheduleForm(){const d=S.schedDraft||(S.schedDraft={when:'At sunset',what:['Wallpaper','Colors'],to:'Evening',display:'All displays'});const opts=[...Object.keys(LOOKS),...S.library.map(x=>x.name)];const allWhat=['Wallpaper','Colors','Widget style','Widgets & placement'];const sun=/sun|Golden/.test(d.when);const needCity=sun&&!S.saved.city;return `${pageHead('New schedule')}<div class="form"><div class="h2">Start from ${help('Presets fill in the steps below. They replace the old Daily cycle and Adaptive looks choices.','Help: presets')}</div>${seg(['Daily cycle','Day & night widgets','Blank'],d.preset||'Blank','sd-preset','Preset')}<div class="h2">1. When</div>${seg(['At sunrise','At sunset','Golden hour','At a set time','When a display connects'],d.when,'sd:when','When')}${sun?`<p class="note ${needCity?'next':''}">${needCity?'Needs a city. <button class="btn quiet small-btn" data-a="w:Weather">Set city</button>':`Uses ${esc(S.saved.city)} from Weather.`}</p>`:''}<div class="h2">2. Change what</div><div class="rows">${allWhat.map(w=>row(esc(w),plainSw(d.what.includes(w),w,'sd-what:'+w))).join('')}</div><p class="note">Everything else stays as it is.</p><div class="h2">3. To which saved choice</div><select class="field" aria-label="Saved choice" data-change="sd:to">${opts.map(o=>`<option ${o===d.to?'selected':''}>${esc(o)}</option>`).join('')}</select><div class="h2">Display</div>${seg(['All displays','Main display','Laptop'],d.display,'sd:display','Display')}<div class="cap" style="margin-top:14px"><button class="btn primary" data-a="sched-save" ${d.what.length&&!needCity?'':'disabled'}>Save schedule</button><button class="btn" data-a="sched-cancel">Discard</button></div></div>`}
function mixView(){const m=S.mix||(S.mix={wall:'Tidal',colors:'Paper',layout:'Current desktop',bars:'Current desktop'});const opts=['Current desktop','Tidal','Paper','Evening',...S.library.map(x=>x.name)];const sel=(k,n)=>row(n,`<select aria-label="${n} from" data-change="mix:${k}">${opts.map(o=>`<option ${o===m[k]?'selected':''}>${esc(o)}</option>`).join('')}</select>`);return `${pageHead('Mix a setup')}<div class="form"><p class="small" style="margin-bottom:10px">Take each part from a different setup, then review it like any other.</p>${rows(sel('wall','Wallpaper'),sel('colors','Colors & fonts'),sel('layout','Widgets & placement'),sel('bars','Dock & panel'))}<div class="cap" style="margin-top:12px"><button class="btn primary" data-a="mix-go">Review this mix</button></div></div>`}
function reviewView(){const name=S.route.name;const d=S.drafts['setup:'+name];if(!d)return `${pageHead(name)}<div class="rows"><div class="r"><span class="small">This preview was closed.</span></div></div>`;refreshDraft(d);const cmp=S.route.cmp||'with';const cfg=cmp==='with'?candidate(d):S.saved;const info=AREAS.map(a=>{const ch=partChanges(d,a.id);let diff=ch.length?`${ch.length} change${ch.length>1?'s':''}`:'Same as now';if(a.id==='wallpaper'&&ch.includes('wall'))diff=`${S.saved.wall} → ${d.values.wall}`;else if(a.id==='appearance'&&ch.includes('theme'))diff=`${S.saved.theme} → ${d.values.theme}`;else if(a.id==='panel'&&ch.includes('panelStyle'))diff=`${S.saved.panelStyle} → ${d.values.panelStyle}`;else if(a.id==='widgetLayout'&&ch.length)diff='Replaces widgets and places';return{a,ch,on:d.parts[a.id],diff}});const main=info.filter(p=>p.ch.length||['wallpaper','appearance','widgetStyle','widgetLayout','dock','panel'].includes(p.a.id));const count=info.filter(p=>p.on&&p.ch.length).length;return `${pageHead(name,{sub:LOOKS[name]?.kind||'Saved setup',end:`<button class="btn quiet small-btn" data-a="cmd:Export ${esc(name)}">Export</button><button class="btn quiet small-btn" data-a="review-copy">Save a copy</button>`})}${conflictBox(d)}<div class="split"><div class="st">${stage({cfg,badge:cmp==='with'?'Preview · not applied':'Now',badgeCls:cmp==='with'?(d.conflicts.length?'warn':'prev'):''})}<div class="cap">${seg(['With setup','Now'],cmp==='with'?'With setup':'Now','cmp','Compare')}<span class="end small">${count} part${count===1?'':'s'} will change</span></div></div><div class="side"><div class="h2">What to use ${help('Turn a part off to keep it as it is now. Apply changes only the parts left on.','Help: parts')}</div><div class="rows" data-r="parts">${main.map(p=>`<div class="r ${p.ch.length?'':'off'}" data-part="${p.a.id}"><div class="l"><div class="lt">${esc(p.a.n)}</div><div class="ls">${esc(p.diff)}</div></div><button class="sw" role="switch" aria-checked="${!!p.on}" aria-label="Use ${esc(p.a.n)}" data-a="part:${esc(name)}:${p.a.id}" ${p.ch.length?'':'disabled'}></button></div>`).join('')}</div><p class="note">${ico('shield')}Notes, calendars and accounts stay.</p></div></div>`}

function fuzzy(q,s){let i=0;for(const c of s){if(c===q[i])i++;if(i===q.length)return true}return false}
function editDistance(a,b){if(Math.abs(a.length-b.length)>2)return 9;let prev=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){const cur=[i];for(let j=1;j<=b.length;j++)cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=cur}return prev[b.length]}
function searchHits(q){q=q.trim().toLowerCase();if(!q)return INDEX.slice(0,6);const words=q.split(/\s+/);const text=e=>(e[0]+' '+e[3]).toLowerCase();const direct=INDEX.filter(e=>words.every(w=>text(e).includes(w)));if(direct.length)return direct;const close=INDEX.filter(e=>words.every(w=>text(e).split(/[^a-z]+/).some(t=>t.length>2&&editDistance(w,t)<=2)));return close.length?close:INDEX.filter(e=>fuzzy(q,e[0].toLowerCase()))}

function nudge(k,dx,dy){const cur=clone((S.drafts.layout?.values||S.saved)['pos.'+k]);cur.x=Math.max(0,Math.min(85,cur.x+dx));cur.y=Math.max(5,Math.min(85,cur.y+dy));draftSet('layout','pos.'+k,cur,WIDGETS[k].n+' position')}
function desktopUndo(){const last=S.history.at(-1);if(!last){say('Nothing to undo','idle');render();return}undoEntry(last);render()}
/* Undo target: this note's text, then the preview on this screen, then the last desktop change. A local no-op never falls through. */
function noteUndo(){const n=S.note;if(!n.undo.length){n.hint='Nothing more to undo in this note.';return false}n.redo.push(n.text);n.text=n.undo.pop();n.hint='';const box=$('#notebox');if(box)box.value=n.text;return true}
function noteRedo(){const n=S.note;if(!n.redo.length)return false;n.undo.push(n.text);n.text=n.redo.pop();const box=$('#notebox');if(box)box.value=n.text;return true}
function noteRevert(){const n=S.note;n.text=n.saved;n.undo=[];n.redo=[];n.hint=''}
function updateNoteHint(){const h=$('[data-note-hint]');if(h)h.textContent=S.note.hint||'Ctrl+Z only ever changes this text.'}

function onKey(e){const mod=e.ctrlKey||e.metaKey;if(e.key==='Escape'&&!pop.hidden){closeHelp();return}if(e.altKey&&e.key==='ArrowLeft'&&!S.wizard&&!S.done){e.preventDefault();back();return}if(mod&&e.key.toLowerCase()==='f'&&!S.wizard&&!S.done){e.preventDefault();act('search');return}if(mod&&e.key.toLowerCase()==='z'){const t=e.target;if(t.id==='notebox'||isNotesPage()){e.preventDefault();if(e.shiftKey)noteRedo();else noteUndo();refreshBar();return}if(t.matches&&t.matches('input,textarea,select'))return;if(S.wizard||S.done){e.preventDefault();return}e.preventDefault();const d=activeDraft();if(d){undoDraftStep(d);render();return}if(activeDraftId()&&S.route.page!=='home'&&!(S.route.page==='widget')){say('Nothing to undo in this preview','idle');render();return}desktopUndo();return}const objEl=e.target.closest&&e.target.closest('.obj.w');if(objEl&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();const st=e.shiftKey?5:1;const k=objEl.dataset.w;nudge(k,e.key==='ArrowLeft'?-st:e.key==='ArrowRight'?st:0,e.key==='ArrowUp'?-st:e.key==='ArrowDown'?st:0);render();$(`.obj.w[data-w="${k}"]`)?.focus({preventScroll:true})}}

function onPointerDown(e){const el=e.target.closest&&e.target.closest('.obj.w');if(!el||e.button)return;const r=el.closest('.stage').getBoundingClientRect();const k=el.dataset.w;const base=(S.drafts.layout?.values||S.saved)['pos.'+k];drag={el,k,r,base,sx:e.clientX,sy:e.clientY,moved:false,x:base.x,y:base.y,pid:e.pointerId}}
function onPointerMove(e){if(!drag)return;if(!drag.moved&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<5)return;if(!drag.moved){drag.moved=true;drag.el.classList.add('dragging');try{drag.el.setPointerCapture(drag.pid)}catch{}}let x=drag.base.x+(e.clientX-drag.sx)/drag.r.width*100,y=drag.base.y+(e.clientY-drag.sy)/drag.r.height*100;if(S.snap){x=Math.round(x/2)*2;y=Math.round(y/2)*2}x=Math.max(0,Math.min(85,x));y=Math.max(5,Math.min(85,y));drag.x=x;drag.y=y;drag.el.style.left=x+'%';drag.el.style.top=y+'%'}
function onPointerUp(){if(!drag)return;const d=drag;drag=null;if(!d.moved)return;suppressClick=true;setTimeout(()=>suppressClick=false,0);draftSet('layout','pos.'+d.k,{x:d.x,y:d.y,d:d.base.d},WIDGETS[d.k].n+' position');render();$(`.obj.w[data-w="${d.k}"]`)?.focus({preventScroll:true})}

 {say:'Type in the note.',why:'The bar switches to this note: Unsaved, Revert, Save note.',t:'#notebox',run:()=>typeInto('#notebox',S.note.text+' Add a walk.'),done:()=>S.note.text!==S.note.saved},
 {say:'Press Ctrl+Z.',why:'It undoes your typing, here, in this note.',t:'#notebox',run:()=>pressUndo('#notebox'),done:()=>S.note.text===S.note.saved&&!S.note.undo.length},
 {say:'Press Ctrl+Z again.',why:'Nothing is left to undo, and it stops. Your clock face is untouched.',t:'#notebox',run:()=>pressUndo('#notebox'),done:()=>S.note.hint&&S.saved['d.Clock.face']==='Analog'},
 {say:'Type again, then save.',why:'Save note is explicit. It is not a desktop change.',t:'#notebox',run:()=>typeInto('#notebox',S.note.text+' Add a walk.'),done:()=>S.note.text!==S.note.saved},
 {say:'Save note.',why:'Saved separately from your desktop history.',t:A('note-save'),done:()=>S.note.saved!==NOTE&&S.note.state==='Saved'},
 {say:'Go to Desktop.',why:'The named Undo is still Clock face, exactly as before.',t:A('root:Desktop'),done:()=>R().page==='home'&&S.history.at(-1)?.label==='Clock face'}]},
{id:'focus',name:'Hidden timer',steps:[
 {say:'Open Focus timer. It says running and hidden.',why:'The list tells you the truth about a widget you cannot see.',t:A('w:Focus'),done:()=>R().obj==='Focus'},
 {say:'Press Pause.',why:'The widget is hidden and the button still works. It is a command, so it shows its state and offers no Undo.',t:A('focus-toggle'),done:()=>!S.focus.running&&!S.focus.busy},
 {say:'Press Resume.',why:'Live controls have their own marked group. The sample picture beside them is not clickable.',t:A('focus-toggle'),done:()=>S.focus.running&&!S.focus.busy},
 {say:'Show it on the desktop.',why:'Showing is a separate setting.',t:A('toggle:on.Focus:Focus timer on desktop'),done:()=>S.saved['on.Focus']},
 {say:'Hide it again.',why:'The timer keeps running either way.',t:A('toggle:on.Focus:Focus timer on desktop'),done:()=>!S.saved['on.Focus']&&S.focus.running}]},
{id:'first',name:'First run',first:true,start:()=>wizardStart(),steps:[
 {say:'Get started.',why:'Four steps. Nothing changes until the last one.',t:A('wiz-next'),done:()=>S.wizard?.step===0},
 {say:'Choose Tidal.',why:'The whole picture follows your choice, as a preview.',t:A('wiz-start:Tidal'),done:()=>S.wizard?.start==='Tidal'},
 {say:'Continue.',why:'Next is Dock & panel. It stays in setup.',t:A('wiz-next'),done:()=>S.wizard?.step===1},
 {say:'Choose Customize.',why:'Keep current is the default. Customize shows the real choices.',t:A('wiz-bars:Customize'),done:()=>S.wizard?.bars.mode==='custom'},
 {say:'Choose Islands.',why:'The next-login note sits beside the choice, not behind help.',t:A('wiz-bar:panelStyle:Islands'),done:()=>S.wizard?.bars.panelStyle==='Islands'},
 {say:'Choose a floating dock.',why:'You see it on the picture right away.',t:A('wiz-bar-float:Floating'),done:()=>S.wizard?.bars.dockFloat},
 {say:'Continue.',why:'Widgets next.',t:A('wiz-next'),done:()=>S.wizard?.step===2},
 {say:'Type a city for Weather.',why:'Asked only because Weather is on and no city is set. Part of this draft.',t:'#wizcity',run:()=>typeInto('#wizcity','Split'),done:()=>S.wizard?.city==='Split'},
 {say:'Continue to Review.',why:'Every choice is listed, with a way back to change it.',t:A('wiz-next'),done:()=>S.wizard?.step===3},
 {say:'Press Leave.',why:'Exits say what they do. Your desktop has not changed.',t:A('wiz-leave-ask'),done:()=>S.wizard?.leaving&&S.saved.city===null},
 {say:'Press Stay.',why:'Try Leave yourself later: both ways keep the desktop as it is.',t:A('wiz-leave:stay'),done:()=>S.wizard&&!S.wizard.leaving},
 {say:'Apply and finish.',why:'One change. The city is saved only now.',t:A('wiz-next'),done:()=>S.done&&S.saved.city==='Split'},
 {say:'Go to my desktop.',why:'A clear end: what changed, what starts at next login, and one Undo.',t:A('done-go'),done:()=>!S.done&&R().page==='home'}]},
{id:'search',name:'Find a setting',steps:[
 {say:'Open Search.',why:'Search is always in the same place.',t:A('search'),done:()=>R().page==='search'},
 {say:'Type “spectrum”.',why:'Results show where you will land.',t:'#searchbox',run:()=>typeInto('#searchbox','spectrum'),done:()=>R().query==='spectrum'},
 {say:'Open the result.',why:'You land on the exact control, highlighted.',t:'[data-hits] .open',done:()=>R().page==='widget'&&R().obj==='Music'&&R().tab==='Design'},
 {say:'Turn Spectrum on.',why:'It belongs to Music’s Design, so scope reads “Music only”.',t:A('toggle:d.Music.spectrum:Spectrum'),done:()=>S.saved['d.Music.spectrum']},
 {say:'Press Back.',why:'Back to your results, with your search still there.',t:A('back'),done:()=>R().page==='search'&&R().query==='spectrum'}]},
{id:'fail',name:'Failed save',setup:()=>{S.sim='fail';syncTools()},steps:[
 {say:'Open Settings.',why:'The sample is set so the next save fails.',t:A('root:Settings'),done:()=>R().page==='settings'},
 {say:'Open Accessibility.',why:'Settings is a plain list, with each value shown.',t:A('setting:Accessibility'),done:()=>R().obj==='Accessibility'},
 {say:'Turn on Reduce motion.',why:'You see Saving beside the switch. A repeat click cannot queue another save.',t:A('toggle:reduceMotion:Reduce motion'),done:()=>S.errors.reduceMotion},
 {say:'Try it again.',why:'The error stayed beside the switch and the value did not pretend to change. This time it saves.',t:A('toggle:reduceMotion:Reduce motion'),done:()=>S.saved.reduceMotion===true},
 {say:'Undo it.',why:'Saved, then a named Undo.',t:A('undo'),done:()=>S.saved.reduceMotion===false}]},
{id:'scope',name:'Shared style',steps:[
 {say:'Open Clock.',why:'A widget’s own design, and the shared finish, must never look the same.',t:A('w:Clock'),done:()=>R().obj==='Clock'},
 {say:'Open Design.',why:'“Changes: Clock only” is visible before you touch anything.',t:A('tab:Design'),done:()=>R().tab==='Design'},
 {say:'Open Desktop finish.',why:'It says it is shared, and it opens with the right scope already chosen.',t:A('surfaces:Widgets'),done:()=>R().tab==='Surfaces'&&S.surfaceScope==='Widgets'},
 {say:'Choose Smoked.',why:'Outlined items are what changes. Dock and panel stay as they are.',t:A('set:finish.Widgets:Widgets finish:Smoked'),done:()=>S.saved['finish.Widgets']==='Smoked'&&S.saved.finish==='Frosted'},
 {say:'Press Back.',why:'Back to Clock, in Design.',t:A('back'),done:()=>R().obj==='Clock'&&R().tab==='Design'}]},
{id:'update',name:'Updates',steps:[
 {say:'Open Settings.',why:'One list. Updates shows its state before you open it.',t:A('root:Settings'),done:()=>R().page==='settings'},
 {say:'Open Updates.',why:'One product, one status, one way to update. Islands is simply included.',t:A('setting:Updates'),done:()=>R().obj==='Updates'},
 {say:'Try the Next login state.',why:'An exception appears only when it is real. No forced logout.',t:A('update-state:Next login'),done:()=>S.update==='login'},
 {say:'Open system updates.',why:'Your system installs updates. No fake progress here.',t:A('cmd:Open system updates'),done:()=>S.msg.text.startsWith('Open system updates')}]}];
let J=null,ringEl=null;
function startJourney(id){const j=JOURNEYS.find(x=>x.id===id);const review=S.reviewMode;S=fresh(!!j.first);S.reviewMode=review;closeHelp();J={j,i:0};if(j.setup)j.setup();if(j.start)j.start();else render();syncCoach();$$('[data-task]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.task===id)))}
function endJourney(){J=null;clearRing();$('#coach').classList.remove('on','finished');$$('[data-task]').forEach(b=>b.setAttribute('aria-pressed','false'))}
function clearRing(){if(ringEl)ringEl.classList.remove('coach-ring');ringEl=null;$$('.coach-ring').forEach(e=>e.classList.remove('coach-ring'))}
function stepTarget(s){return typeof s.t==='function'?s.t():firstVisible(s.t)}
function syncCoach(){if(!J)return;while(J.i<J.j.steps.length&&J.j.steps[J.i].done())J.i++;const c=$('#coach');c.classList.add('on');clearRing();if(J.i>=J.j.steps.length){c.classList.add('finished');mount(c,`<div class="ct"><div class="cs">${esc(J.j.name)} · done</div><div class="ci">That’s the whole task.</div><div class="cn">Everything stays as you left it. Keep exploring, or try another task.</div></div><div class="cb"><button type="button" data-coach="again">Start over</button><button type="button" data-coach="close">Close</button></div>`);return}c.classList.remove('finished');const s=J.j.steps[J.i];mount(c,`<div class="ct"><div class="cs">${esc(J.j.name)} · step ${J.i+1} of ${J.j.steps.length}</div><div class="ci">${esc(s.say)}</div><div class="cn">${esc(s.why)}</div></div><div class="cb"><button type="button" class="go" data-coach="do">Do it for me</button><button type="button" data-coach="close">Close</button></div>`);const el=stepTarget(s);if(el){el.classList.add('coach-ring');ringEl=el;el.scrollIntoView({block:'nearest',inline:'nearest'})}}
function coachDo(){if(!J||J.i>=J.j.steps.length)return;const s=J.j.steps[J.i];if(s.run){s.run();syncCoach();return}const el=stepTarget(s);if(el)el.click()}
function syncTools(){const f=$('#sim');if(f)f.value=S.sim}
function fitFrame(){const win=$('#win');const wrap=$('#frame-wrap');win.style.zoom='';const f=win.dataset.frame;if(f==='fit')return;const need={native:820,large:1024,wide:1280}[f];const avail=wrap.clientWidth-4;win.style.zoom=avail<need?(avail/need).toFixed(3):''}
function setFrame(f){$('#win').dataset.frame=f;$('#frame').value=f;fitFrame();render()}
function initReview(){if(!getComputedStyle(document.documentElement).getPropertyValue('--background').trim())document.documentElement.classList.add('standalone');mount($('#tasks'),JOURNEYS.map(j=>`<button type="button" data-task="${j.id}" aria-pressed="false">${esc(j.name)}</button>`).join(''));$('#tasks').addEventListener('click',e=>{const b=e.target.closest('[data-task]');if(b)startJourney(b.dataset.task)});$('#coach').addEventListener('click',e=>{const b=e.target.closest('[data-coach]');if(!b)return;const a=b.dataset.coach;if(a==='do')coachDo();else if(a==='close')endJourney();else if(a==='again')startJourney(J.j.id)});$('#frame').addEventListener('change',e=>setFrame(e.target.value));$('#theme').addEventListener('change',e=>{S.reviewMode=e.target.value==='auto'?null:e.target.value;render()});$('#sim').addEventListener('change',e=>{S.sim=e.target.value;say(S.sim==='fail'?'Sample: the next save will fail':S.sim==='slow'?'Sample: saves are slow':'Sample: saves are normal','idle');render()});$('#reset').addEventListener('click',()=>{endJourney();const review=S.reviewMode;S=fresh();S.reviewMode=review;syncTools();render()});const avail=$('#frame-wrap').clientWidth;setFrame(avail>=1284?'wide':avail>=824?'native':'fit');new ResizeObserver(fitFrame).observe($('#frame-wrap'))}

boot();
</script></body></html>
