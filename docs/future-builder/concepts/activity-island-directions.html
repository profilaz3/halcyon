<p class="intro">Four directions without permanent activity icons. These are interactive design concepts, not app screenshots.</p>
<div class="demo" aria-label="Sample activity scenario"><span>Scenario</span><button data-scene="solo" aria-pressed="false">Music only</button><button data-scene="two" aria-pressed="true">Music + timer</button><button data-scene="meeting" aria-pressed="false">Meeting soon</button></div>
<div class="grid" id="grid"></div>
<p class="footer">Try the controls, the second activity, or “In bar”. Hover opens a compact island; click its title to hold it open. Escape closes it. All actions use sample data.</p>
<script>
const svg=(s)=>'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">'+s+'</svg>';
const icons={pause:svg('<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>'),play:svg('<path d="M7 4v16l14-8z"/>'),prev:svg('<path d="M6 5h2v14H6zm12 0v14L8 12z"/>'),next:svg('<path d="M16 5h2v14h-2zM6 5v14l10-7z"/>'),focus:svg('<path fill-rule="evenodd" d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18m0 2a7 7 0 1 1 0 14 7 7 0 0 1 0-14m-1 2h2v5l3 2-1 1.5-4-2.5z"/>'),calendar:svg('<path fill-rule="evenodd" d="M5 3h2v2h10V3h2v2h2v16H3V5h2zm0 8v8h14v-8zm2 2h3v3H7z"/>')};
const defs=[['a','Quiet priority','Only the current activity.','A meeting takes priority when it matters. No manual activity switcher.'],['b','Live companion','A second activity earns its place.','The small counter exists only while another activity is active. Click it to swap.'],['c','Title picker','Everything else stays tucked away.','A chevron opens a short text list. No permanent tabs or extra capsule.'],['d','Activity ribbon','Controls beside the content.','A quiet text line names the next activity. Click it to bring it forward.']];
let scene='two';const states={};
for(const [id,title,lead,desc] of defs){states[id]={kind:'music',open:true,held:true,playing:true,running:true,picking:false,track:0,started:false};document.getElementById('grid').insertAdjacentHTML('beforeend',`<section><h2 class="heading"><span class="letter">${id.toUpperCase()}</span>${title}</h2><div class="stage ${id}" id="stage-${id}"><div class="bar"><span>Apps</span><span>09:41</span></div><div class="anchor"><div class="island open" id="island-${id}" data-kind="music"><button class="header" aria-label="Hold or release activity" id="head-${id}"><span class="signal"></span><span class="title"></span><span class="chevron">⌄</span></button><div class="sub"></div><div class="body"></div>${id==='c'?'<button class="more" aria-label="Other activities" aria-expanded="false">⌄</button><div class="picker"></div>':''}${id==='d'?'<button class="queue"></button>':''}</div>${id==='b'?'<button class="satellite" title="Show the other active activity"></button>':''}</div><div class="interaction"><span id="feedback-${id}">Held open</span><button class="toggle" type="button">In bar</button></div></div><p class="desc"><strong>${lead}</strong> ${desc}</p></section>`);bind(id);paint(id)}
function other(s){return s.kind==='music'?(scene==='meeting'?'calendar':scene==='two'?'focus':null):'music'}
function datum(s,kind=s.kind){if(kind==='music')return {title:['Golden Hour','Slow Morning','Afterglow'][s.track],sub:'Aura · Solstice',status:s.playing?'Playing':'Paused',small:'Music'};if(kind==='focus'){const active=scene==='two'||s.started;return {title:active?'18:42':'25:00',sub:active?(s.running?'Focus session':'Focus paused'):'Focus timer',status:active?(s.running?'Until 10:00':'Paused'):'Ready',small:active?'18:42':'Focus'}};if(scene!=='meeting')return {title:'Calendar',sub:'No upcoming meetings',status:'',small:'Calendar'};return {title:'Design catch-up',sub:'10:00–10:30 · Personal',status:'In 3 min',small:'3 min'}}
function paint(id){const s=states[id],el=document.getElementById('island-'+id),d=datum(s);el.classList.toggle('open',s.open);el.classList.toggle('picking',s.picking&&s.open);el.dataset.kind=s.kind;el.querySelector('.title').textContent=d.title;el.querySelector('.sub').textContent=d.sub;el.querySelector('.signal').innerHTML=s.kind==='music'?'<i></i><i></i><i></i>':icons[s.kind];const body=el.querySelector('.body');body.innerHTML='<span class="status">'+d.status+'</span>'+(s.kind==='music'?'<button class="action" data-action="prev" aria-label="Previous track">'+icons.prev+'</button><button class="action main" data-action="toggle" aria-label="'+(s.playing?'Pause':'Play')+'">'+icons[s.playing?'pause':'play']+'</button><button class="action" data-action="next" aria-label="Next track">'+icons.next+'</button>':s.kind==='focus'?'<button class="action main text" data-action="toggle">'+(scene!=='two'&&!s.started?'Start':s.running?'Pause':'Resume')+'</button>':'<button class="action main text" data-action="calendar">Open</button>');
body.querySelectorAll('button').forEach(b=>{b.tabIndex=s.open?0:-1;b.onclick=e=>{e.stopPropagation();const a=b.dataset.action;if(a==='toggle'){if(s.kind==='music')s.playing=!s.playing;else if(scene!=='two'&&!s.started){s.started=true;s.running=true}else s.running=!s.running}else if(a==='prev'||a==='next')s.track=(s.track+(a==='next'?1:2))%3;else{feedback(id,'Calendar action · sample');return}paint(id)}});
const next=other(s),stage=document.getElementById('stage-'+id);stage.querySelector('.toggle').textContent=s.open?'In bar':'Expand';if(id==='b'){const b=stage.querySelector('.satellite');b.hidden=!next;b.textContent=next?datum(s,next).small:'';b.setAttribute('aria-label',next?'Show '+next:'No second activity');b.onclick=()=>{s.kind=next;s.open=true;s.held=true;paint(id);feedback(id,'Activities swapped')}}
if(id==='c'){el.querySelector('.more').tabIndex=s.open?0:-1;el.querySelector('.more').setAttribute('aria-expanded',String(s.picking));const picker=el.querySelector('.picker');picker.innerHTML=['music','focus','calendar'].filter(k=>k!==s.kind).map(k=>'<button data-kind="'+k+'" tabindex="'+(s.picking&&s.open?0:-1)+'">'+(k==='music'?datum(s,k).title:k==='focus'?'Focus timer':'Calendar')+'<small>'+(k==='music'?(s.playing?'Playing':'Paused'):k==='focus'?(scene==='two'?'18:42':'Ready'):(scene==='meeting'?'In 3 min':'No upcoming event'))+'</small></button>').join('');picker.querySelectorAll('button').forEach(b=>b.onclick=()=>{s.kind=b.dataset.kind;s.picking=false;s.held=true;paint(id);feedback(id,'Activity selected')})}
if(id==='d'){const q=el.querySelector('.queue');q.classList.toggle('empty-queue',!next);q.disabled=!next;q.tabIndex=s.open&&next?0:-1;q.innerHTML=next?(next==='focus'?'Focus · 18:42 remaining':next==='calendar'?'Design catch-up · in 3 min':'Music · '+datum(s,'music').title)+'<span>→</span>':'No other active activity';q.onclick=()=>{s.kind=next;s.held=true;paint(id);feedback(id,'Next activity')}}}
function feedback(id,text){document.getElementById('feedback-'+id).textContent=text}
function setOpen(id,open,held=false){const s=states[id];s.open=open;s.held=held;if(!open)s.picking=false;paint(id);feedback(id,open?(held?'Held open':'Hover preview'):'In the bar')}
function bind(id){const el=document.getElementById('island-'+id),stage=document.getElementById('stage-'+id);let timer;el.onpointerenter=e=>{if(e.pointerType==='touch')return;clearTimeout(timer);timer=setTimeout(()=>setOpen(id,true,states[id].held),120)};el.onpointerleave=()=>{clearTimeout(timer);if(!states[id].held)timer=setTimeout(()=>setOpen(id,false),240)};el.querySelector('.header').onclick=()=>{clearTimeout(timer);const s=states[id];setOpen(id,!s.open||!s.held,!s.open||!s.held)};el.onkeydown=e=>{if(e.key==='Escape'){clearTimeout(timer);setOpen(id,false);el.querySelector('.header').focus()}if(e.key==='Tab'&&states[id].open)states[id].held=true};stage.querySelector('.toggle').onclick=()=>{clearTimeout(timer);setOpen(id,!states[id].open,!states[id].open)};stage.onclick=e=>{if(e.target===stage){clearTimeout(timer);setOpen(id,false)}};if(id==='c')el.querySelector('.more').onclick=()=>{const s=states[id];s.picking=!s.picking;s.held=true;paint(id);feedback(id,s.picking?'Choose another activity':'Held open')}}
document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>{scene=b.dataset.scene;document.querySelectorAll('[data-scene]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));for(const id of Object.keys(states)){const s=states[id];s.kind=scene==='meeting'?'calendar':'music';s.started=false;s.running=true;s.picking=false;paint(id);feedback(id,scene==='meeting'?'Upcoming meeting has priority':s.open?'Held open':'In the bar')}});
</script></body></html>
